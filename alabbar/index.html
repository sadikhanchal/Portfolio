<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al Abbar Meats — POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --magenta:#C8106B;
    --magenta-dk:#9E0B54;
    --lime:#8FBF1E;
    --lime-dk:#6F980F;
    --ink:#1C1218;
    --muted:#7A6F74;
    --line:#EAE2E6;
    --bg:#F7F3F4;
    --surface:#FFFFFF;
    --steel:#3E7CA6;
    --fresh:#5A8F12;
    --frozen:#3E7CA6;
    --danger:#C0392B;
    --cat-mutton:#B0324A;
    --cat-beef:#7A3B22;
    --cat-veal:#C76E8B;
    --cat-fish:#1F7FA6;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing:border-box;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;
    background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  .tabnum{font-variant-numeric:tabular-nums}

  /* ---------- App shell ---------- */
  #app{display:flex;flex-direction:column;height:100%}
  header.top{
    display:flex;align-items:center;gap:12px;
    padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .mark{width:44px;height:44px;flex:0 0 auto;object-fit:contain;background:#fff;border-radius:9px;border:1px solid var(--line);padding:2px}
  .brand h1{font-size:15px;line-height:1.1;margin:0;font-weight:700}
  .brand .ar{font-size:12px;color:var(--muted);font-weight:500}
  .segmented{margin-left:auto;display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
  .segmented button{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
  .segmented button.active{background:var(--magenta);color:#fff}
  .datechip{font-size:12px;color:var(--muted);white-space:nowrap;padding-left:6px}

  main{flex:1;min-height:0;overflow:hidden}
  .view{display:none;height:100%}
  .view.active{display:block}

  /* ---------- POS ---------- */
  .pos{display:grid;grid-template-columns:1fr 360px;height:100%}
  .grid-wrap{overflow:auto;padding:16px;height:100%}
  .cat-row{margin-bottom:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .card{
    background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--spine,#ccc);
    border-radius:13px;padding:12px 12px 11px;text-align:left;position:relative;
    transition:transform .06s ease, box-shadow .12s ease;
    min-height:104px;display:flex;flex-direction:column;
  }
  .card:active{transform:scale(.97)}
  .card:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
  .card .en{font-weight:700;font-size:14px;line-height:1.2}
  .card .ar{font-size:13px;color:var(--muted);margin-top:2px;direction:rtl}
  .card .foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;padding-top:8px}
  .card .price{font-weight:700;font-size:15px}
  .card .price small{font-weight:500;color:var(--muted);font-size:11px}
  .chip{font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:999px;color:#fff;align-self:flex-start}
  .chip.fresh{background:var(--fresh)}
  .chip.frozen{background:var(--frozen)}
  .card .stockbadge{position:absolute;top:10px;right:10px;font-size:10px;color:var(--muted)}
  .card.out{opacity:.5}

  /* ---------- Cart ---------- */
  .cart{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;height:100%}
  .cart h2{margin:0;padding:16px 16px 10px;font-size:14px;font-weight:700}
  .cart h2 span{color:var(--muted);font-weight:500}
  .lines{flex:1;overflow:auto;padding:0 10px}
  .line{display:flex;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line)}
  .line .info{flex:1;min-width:0}
  .line .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .line .sub{font-size:11.5px;color:var(--muted)}
  .line .amt{font-weight:700;font-size:14px;white-space:nowrap}
  .line .del{color:var(--danger);font-size:18px;padding:2px 6px;line-height:1}
  .cart-empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}
  .cart-foot{padding:12px 16px;border-top:1px solid var(--line)}
  .totalrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .totalrow .lbl{font-size:13px;color:var(--muted)}
  .totalrow .val{font-size:30px;font-weight:700;letter-spacing:-.5px}
  .totalrow .val small{font-size:14px;font-weight:600;color:var(--muted)}
  .btn{width:100%;padding:15px;border-radius:12px;font-weight:700;font-size:15px}
  .btn.primary{background:var(--magenta);color:#fff}
  .btn.primary:disabled{background:#E7C6D8;color:#fff;cursor:not-allowed}
  .btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}

  /* ---------- Modal / keypad ---------- */
  .overlay{position:fixed;inset:0;background:rgba(20,10,16,.5);display:none;align-items:flex-end;justify-content:center;z-index:40}
  .overlay.show{display:flex}
  .sheet{background:var(--surface);width:100%;max-width:460px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .18s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
  @media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:20px}}
  .kp-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
  .kp-head .nm{font-weight:700;font-size:16px}
  .kp-head .ar{font-size:13px;color:var(--muted);direction:rtl}
  .kp-head .rate{font-size:12px;color:var(--muted);margin-top:2px}
  .kp-close{font-size:22px;color:var(--muted);padding:0 4px;line-height:1}
  .readout{background:var(--bg);border-radius:14px;padding:14px 16px;margin:10px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
  .readout .w{font-size:34px;font-weight:700}
  .readout .w small{font-size:16px;color:var(--muted);font-weight:600}
  .readout .a{font-size:20px;font-weight:700;color:var(--magenta)}
  .scalehint{font-size:11px;color:var(--muted);text-align:center;margin:2px 0 10px}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .keys button{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:20px;font-weight:600}
  .keys button:active{background:#EDE6E9}
  .keys button.wide{grid-column:span 1}
  .kp-add{margin-top:10px}

  /* ---------- Slip ---------- */
  .slip{background:#fff;color:#000;width:300px;max-width:100%;margin:0 auto;padding:16px;font-size:12.5px;line-height:1.45}
  .slip .sh{text-align:center;border-bottom:1px dashed #000;padding-bottom:8px;margin-bottom:8px}
  .slip .sh img{width:150px;max-width:72%;height:auto;display:block;margin:0 auto 6px}
  .slip .sh .ar{font-size:16px;font-weight:700;direction:rtl}
  .slip .sh .en{font-size:13px;font-weight:700;letter-spacing:.5px}
  .slip .sh .sub{font-size:11px}
  .slip .meta{display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px}
  .slip table{width:100%;border-collapse:collapse}
  .slip th{text-align:left;font-size:10.5px;border-bottom:1px solid #000;padding:3px 0}
  .slip th.r,.slip td.r{text-align:right}
  .slip td{padding:4px 0;vertical-align:top;font-size:11.5px}
  .slip td .ar{font-size:10.5px;color:#333;direction:rtl}
  .slip .tot{border-top:1px dashed #000;margin-top:6px;padding-top:6px;display:flex;justify-content:space-between;font-weight:700;font-size:15px}
  .slip .note{text-align:center;font-size:10px;margin-top:8px;border-top:1px dashed #000;padding-top:6px}
  .slip .wa{text-align:center;font-size:11px;margin-top:4px;direction:rtl}
  .slip-actions{display:flex;gap:8px;margin-top:14px}
  .slip-actions .btn{padding:13px}

  /* ---------- Dashboard ---------- */
  .dash{overflow:auto;height:100%;padding:16px;max-width:900px;margin:0 auto}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
  .kpi .lbl{font-size:12px;color:var(--muted)}
  .kpi .big{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.5px}
  .kpi .big small{font-size:13px;color:var(--muted);font-weight:600}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px 12px;margin-bottom:16px}
  .panel h3{font-size:13px;margin:12px 2px 8px;font-weight:700}
  .prow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:none}
  .prow .nm{font-size:13px;font-weight:600;flex:0 0 130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow .bar{flex:1;height:8px;background:var(--bg);border-radius:6px;overflow:hidden}
  .prow .bar i{display:block;height:100%;background:var(--magenta);border-radius:6px}
  .prow .kg{font-size:12px;color:var(--muted);flex:0 0 62px;text-align:right}
  .prow .sar{font-size:13px;font-weight:700;flex:0 0 78px;text-align:right}
  .dash-empty{color:var(--muted);text-align:center;padding:30px;font-size:13px}
  .stockgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:6px 0}
  .stockcell{border:1px solid var(--line);border-radius:10px;padding:9px 10px}
  .stockcell .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stockcell .kg{font-size:16px;font-weight:700;margin-top:2px}
  .stockcell.low{border-color:var(--danger);background:#FCEEEC}
  .stockcell.low .kg{color:var(--danger)}

  /* ---------- Settings ---------- */
  .settings{overflow:auto;height:100%;padding:16px;max-width:760px;margin:0 auto}
  .setrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .setrow .nm{flex:1;min-width:0}
  .setrow .nm .en{font-size:13px;font-weight:600}
  .setrow .nm .ar{font-size:11.5px;color:var(--muted);direction:rtl}
  .setrow .fld{display:flex;flex-direction:column;align-items:center;gap:2px}
  .setrow .fld label{font-size:10px;color:var(--muted)}
  .setrow input{width:78px;padding:8px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:14px;text-align:center;font-weight:600}
  .danger-zone{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
  .danger-zone button{padding:11px 16px;border-radius:11px;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface)}
  .danger-zone button.red{color:var(--danger);border-color:#E9BDB7}
  .sec-title{font-size:13px;font-weight:700;color:var(--muted);margin:6px 2px 10px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:11px;font-size:13px;font-weight:600;opacity:0;transition:.2s;z-index:60;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%)}

  /* mobile POS: stack, floating cart bar */
  @media(max-width:760px){
    .pos{grid-template-columns:1fr;grid-template-rows:1fr auto}
    .cart{border-left:none;border-top:1px solid var(--line);max-height:46%}
    .datechip{display:none}
    .segmented button{padding:8px 11px;font-size:12px}
    .kpis{grid-template-columns:1fr 1fr}
  }

  @media print{
    body *{visibility:hidden}
    #slipPrint,#slipPrint *{visibility:visible}
    #slipPrint{position:absolute;left:0;top:0;width:100%}
    .slip{width:100%;max-width:320px}
    @page{margin:6mm}
  }
</style>
</head>

      <div>
        <h1>Al Abbar Meats</h1>
        <div class="ar">الأبار للحوم</div>
      </div>
    </div>
    <div class="segmented" id="nav">
      <button data-view="pos" class="active">POS</button>
      <button data-view="dash">Owner</button>
      <button data-view="settings">Settings</button>
    </div>
    <div class="datechip" id="dateChip"></div>
  </header>

  <main>
    <!-- POS -->
    <section class="view active" id="view-pos">
      <div class="pos">
        <div class="grid-wrap"><div class="grid" id="grid"></div></div>
        <aside class="cart">
          <h2>Current order <span id="orderCode"></span></h2>
          <div class="lines" id="lines"></div>
          <div class="cart-foot">
            <div class="totalrow">
              <span class="lbl">Total</span>
              <span class="val tabnum"><span id="total">0.00</span> <small>SAR</small></span>
            </div>
            <button class="btn primary" id="printBtn" disabled>Print slip</button>
          </div>
        </aside>
      </div>
    </section>

    <!-- Owner dashboard -->
    <section class="view" id="view-dash">
      <div class="dash">
        <div class="kpis">
          <div class="kpi"><div class="lbl">Today's sales</div><div class="big tabnum"><span id="kToday">0.00</span> <small>SAR</small></div></div>
          <div class="kpi"><div class="lbl">Orders</div><div class="big tabnum" id="kOrders">0</div></div>
          <div class="kpi"><div class="lbl">Weight sold</div><div class="big tabnum"><span id="kKg">0.0</span> <small>kg</small></div></div>
        </div>
        <div class="panel">
          <h3>Sales by product — today</h3>
          <div id="byProduct"><div class="dash-empty">No sales yet today.</div></div>
        </div>
        <div class="panel">
          <h3>Available stock</h3>
          <div class="stockgrid" id="stockGrid"></div>
        </div>
      </div>
    </section>

    <!-- Settings -->
    <section class="view" id="view-settings">
      <div class="settings">
        <div class="sec-title">Prices &amp; stock</div>
        <div id="setList"></div>
        <div class="danger-zone">
          <button class="red" id="resetDay">Reset today's sales</button>
          <button class="red" id="resetAll">Reset everything</button>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- Weight keypad -->
<div class="overlay" id="kpOverlay">
  <div class="sheet" id="kpSheet">
    <div class="kp-head">
      <div>
        <div class="nm" id="kpName"></div>
        <div class="ar" id="kpAr"></div>
        <div class="rate" id="kpRate"></div>
      </div>
      <button class="kp-close" id="kpClose">&times;</button>
    </div>
    <div class="readout">
      <div class="w tabnum"><span id="kpWeight">0.000</span> <small>kg</small></div>
      <div class="a tabnum"><span id="kpAmount">0.00</span> SAR</div>
    </div>
    <div class="scalehint">Scale not connected — enter weight manually. Auto-fills from the scale in the final build.</div>
    <div class="keys" id="keys">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k=".">.</button><button data-k="0">0</button><button data-k="del">&#9003;</button>
    </div>
    <button class="btn primary kp-add" id="kpAdd">Add to order</button>
  </div>
</div>

<!-- Slip -->
<div class="overlay" id="slipOverlay">
  <div class="sheet" style="max-width:360px">
    <div id="slipPrint"><div class="slip" id="slipBody"></div></div>
    <div class="slip-actions">
      <button class="btn ghost" id="slipDone">Done</button>
      <button class="btn primary" id="slipPrintBtn">Print</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ---------------- storage ---------------- */
const LS_PROD="alabbar_products_v1", LS_SALES="alabbar_sales_v1";
function load(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

const SEED=[
 {id:"mut-bal-f",en:"Mutton Baladi",ar:"لحم ضأن بلدي",type:"fresh",cat:"mutton",price:45,stock:40},
 {id:"mut-pak-z",en:"Mutton Pakistani",ar:"لحم ضأن باكستاني",type:"frozen",cat:"mutton",price:32,stock:60},
 {id:"mut-ind-z",en:"Mutton Indian",ar:"لحم ضأن هندي",type:"frozen",cat:"mutton",price:30,stock:60},
 {id:"bef-bal-f",en:"Beef Baladi",ar:"لحم بقر بلدي",type:"fresh",cat:"beef",price:38,stock:50},
 {id:"bef-pak-z",en:"Beef Pakistani",ar:"لحم بقر باكستاني",type:"frozen",cat:"beef",price:28,stock:80},
 {id:"bef-ind-z",en:"Beef Indian",ar:"لحم بقر هندي",type:"frozen",cat:"beef",price:26,stock:80},
 {id:"bef-brz-z",en:"Beef Brazil",ar:"لحم بقر برازيلي",type:"frozen",cat:"beef",price:24,stock:80},
 {id:"vea-bal-f",en:"Veal Baladi",ar:"لحم عجل بلدي",type:"fresh",cat:"veal",price:40,stock:35},
 {id:"vea-pak-z",en:"Veal Pakistani",ar:"لحم عجل باكستاني",type:"frozen",cat:"veal",price:30,stock:45},
 {id:"vea-ind-z",en:"Veal Indian",ar:"لحم عجل هندي",type:"frozen",cat:"veal",price:28,stock:45},
 {id:"fsh-f",en:"Fish",ar:"سمك",type:"fresh",cat:"fish",price:22,stock:30},
 {id:"fsh-z",en:"Fish",ar:"سمك",type:"frozen",cat:"fish",price:18,stock:40},
];
const CATCOLOR={mutton:"var(--cat-mutton)",beef:"var(--cat-beef)",veal:"var(--cat-veal)",fish:"var(--cat-fish)"};

let products=load(LS_PROD,null);
if(!products){products=SEED.map(p=>({...p}));save(LS_PROD,products);}
let sales=load(LS_SALES,[]);
let cart=[]; // {id,weight}

/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s);
const money=n=>Number(n).toFixed(2);
const kg=n=>Number(n).toFixed(3);
function todayKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function prod(id){return products.find(p=>p.id===id);}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1600);}

function nextOrderCode(){
  const t=todayKey().slice(2).replace(/-/g,"");
  const n=sales.filter(s=>s.day===todayKey()).length+1;
  return "AB-"+t+"-"+String(n).padStart(3,"0");
}

/* ---------------- date ---------------- */
$("#dateChip").textContent=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});

/* ---------------- nav ---------------- */
$("#nav").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#nav button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  $("#view-"+b.dataset.view).classList.add("active");
  if(b.dataset.view==="dash")renderDash();
  if(b.dataset.view==="settings")renderSettings();
});

/* ---------------- POS grid ---------------- */
function renderGrid(){
  const g=$("#grid");g.innerHTML="";
  products.forEach(p=>{
    const out=p.stock<=0;
    const b=document.createElement("button");
    b.className="card"+(out?" out":"");
    b.style.setProperty("--spine",CATCOLOR[p.cat]);
    b.innerHTML=`
      <div class="stockbadge tabnum">${kg(p.stock)} kg</div>
      <div class="en">${p.en}</div>
      <div class="ar">${p.ar}</div>
      <div class="foot">
        <span class="chip ${p.type}">${p.type==="fresh"?"Fresh · طازج":"Frozen · مجمد"}</span>
        <span class="price tabnum">${p.price}<small> /kg</small></span>
      </div>`;
    b.addEventListener("click",()=>{if(out){toast("Out of stock");return;}openKeypad(p.id);});
    g.appendChild(b);
  });
}

/* ---------------- Cart ---------------- */
function renderCart(){
  const box=$("#lines");
  $("#orderCode").textContent=nextOrderCode();
  if(!cart.length){
    box.innerHTML='<div class="cart-empty">Tap a product to weigh it and add it to the order.</div>';
  }else{
    box.innerHTML="";
    cart.forEach((l,i)=>{
      const p=prod(l.id);const amt=l.weight*p.price;
      const row=document.createElement("div");row.className="line";
      row.innerHTML=`
        <div class="info">
          <div class="nm">${p.en} <span style="color:var(--muted);font-weight:500">${p.type==="fresh"?"·F":"·Z"}</span></div>
          <div class="sub tabnum">${kg(l.weight)} kg × ${p.price} SAR</div>
        </div>
        <div class="amt tabnum">${money(amt)}</div>
        <button class="del" aria-label="Remove">&times;</button>`;
      row.querySelector(".info").addEventListener("click",()=>openKeypad(l.id,i));
      row.querySelector(".del").addEventListener("click",()=>{cart.splice(i,1);renderCart();});
      box.appendChild(row);
    });
  }
  const total=cart.reduce((s,l)=>s+l.weight*prod(l.id).price,0);
  $("#total").textContent=money(total);
  $("#printBtn").disabled=!cart.length;
}

/* ---------------- Keypad ---------------- */
let kp={id:null,editIndex:null,buf:""};
function openKeypad(id,editIndex=null){
  const p=prod(id);
  kp={id,editIndex,buf: editIndex!=null? String(cart[editIndex].weight):""};
  $("#kpName").textContent=p.en+" ("+(p.type==="fresh"?"Fresh":"Frozen")+")";
  $("#kpAr").textContent=p.ar;
  $("#kpRate").textContent=p.price+" SAR / kg · stock "+kg(p.stock)+" kg";
  $("#kpAdd").textContent=editIndex!=null?"Update line":"Add to order";
  updateKpReadout();
  $("#kpOverlay").classList.add("show");
}
function closeKeypad(){$("#kpOverlay").classList.remove("show");}
function kpValue(){return parseFloat(kp.buf||"0")||0;}
function updateKpReadout(){
  const p=prod(kp.id);const w=kpValue();
  $("#kpWeight").textContent=kp.buf===""?"0.000":kp.buf;
  $("#kpAmount").textContent=money(w*p.price);
}
$("#keys").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const k=b.dataset.k;
  if(k==="del"){kp.buf=kp.buf.slice(0,-1);}
  else if(k==="."){if(!kp.buf.includes("."))kp.buf=(kp.buf||"0")+".";}
  else{
    if(kp.buf.includes(".")&&kp.buf.split(".")[1].length>=3)return; // 3 decimals max
    if(kp.buf==="0")kp.buf=k; else kp.buf+=k;
  }
  updateKpReadout();
});
$("#kpAdd").addEventListener("click",()=>{
  const w=kpValue();
  if(w<=0){toast("Enter a weight first");return;}
  const p=prod(kp.id);
  if(w>p.stock+0.0001){toast("Only "+kg(p.stock)+" kg in stock");return;}
  if(kp.editIndex!=null){cart[kp.editIndex].weight=w;}
  else{cart.push({id:kp.id,weight:w});}
  closeKeypad();renderCart();
});
$("#kpClose").addEventListener("click",closeKeypad);
$("#kpOverlay").addEventListener("click",e=>{if(e.target.id==="kpOverlay")closeKeypad();});

/* ---------------- Slip / checkout ---------------- */
$("#printBtn").addEventListener("click",()=>{
  if(!cart.length)return;
  const code=nextOrderCode();
  const now=new Date();
  const lines=cart.map(l=>{const p=prod(l.id);return{id:l.id,en:p.en,ar:p.ar,type:p.type,weight:l.weight,price:p.price,amount:l.weight*p.price};});
  const total=lines.reduce((s,l)=>s+l.amount,0);
  const sale={code,day:todayKey(),time:now.toISOString(),lines,total};
  // commit: reduce stock, save sale
  lines.forEach(l=>{const p=prod(l.id);p.stock=Math.max(0,+(p.stock-l.weight).toFixed(3));});
  sales.push(sale);save(LS_SALES,sales);save(LS_PROD,products);
  buildSlip(sale,now);
  $("#slipOverlay").classList.add("show");
  cart=[];renderCart();renderGrid();
});

      <td class="r tabnum">${l.price}</td>

function renderDash(){
  const today=sales.filter(s=>s.day===todayKey());
  const total=today.reduce((s,x)=>s+x.total,0);
  const wt=today.reduce((s,x)=>s+x.lines.reduce((a,l)=>a+l.weight,0),0);
  $("#kToday").textContent=money(total);
  $("#kOrders").textContent=today.length;
  $("#kKg").textContent=kg(wt);
  // by product
  const agg={};
  today.forEach(s=>s.lines.forEach(l=>{
    const k=l.id;if(!agg[k])agg[k]={en:l.en,type:l.type,kg:0,sar:0};
    agg[k].kg+=l.weight;agg[k].sar+=l.amount;
  }));
  const arr=Object.values(agg).sort((a,b)=>b.sar-a.sar);
  const max=arr.length?arr[0].sar:1;
  const box=$("#byProduct");
  if(!arr.length){box.innerHTML='<div class="dash-empty">No sales yet today.</div>';}
  else{
    box.innerHTML=arr.map(a=>`
      <div class="prow">
        <div class="nm">${a.en} ${a.type==="fresh"?"·F":"·Z"}</div>
        <div class="bar"><i style="width:${Math.max(6,a.sar/max*100)}%"></i></div>
        <div class="kg tabnum">${kg(a.kg)} kg</div>
        <div class="sar tabnum">${money(a.sar)}</div>
      </div>`).join("");
  }
  // stock
  $("#stockGrid").innerHTML=products.map(p=>`
    <div class="stockcell ${p.stock<10?'low':''}">
      <div class="nm">${p.en} ${p.type==="fresh"?"·F":"·Z"}</div>
      <div class="kg tabnum">${kg(p.stock)} <span style="font-size:11px;color:var(--muted);font-weight:500">kg</span></div>
    </div>`).join("");
}

/* ---------------- Settings ---------------- */
function renderSettings(){
  $("#setList").innerHTML=products.map(p=>`
    <div class="setrow" data-id="${p.id}">
      <div class="nm">
        <div class="en">${p.en} <span style="color:var(--muted)">${p.type==="fresh"?"Fresh":"Frozen"}</span></div>
        <div class="ar">${p.ar}</div>
      </div>
      <div class="fld"><label>SAR / kg</label><input type="number" step="0.5" min="0" data-f="price" value="${p.price}"></div>
      <div class="fld"><label>Stock kg</label><input type="number" step="0.1" min="0" data-f="stock" value="${p.stock}"></div>
    </div>`).join("");
  $("#setList").querySelectorAll("input").forEach(inp=>{
    inp.addEventListener("change",e=>{
      const id=e.target.closest(".setrow").dataset.id;
      const p=prod(id);const v=parseFloat(e.target.value)||0;
      p[e.target.dataset.f]=v;save(LS_PROD,products);toast("Saved");
      renderGrid();
    });
  });
}
$("#resetDay").addEventListener("click",()=>{
  if(!confirm("Delete today's sales records? Stock will not be restored."))return;
  sales=sales.filter(s=>s.day!==todayKey());save(LS_SALES,sales);renderDash();toast("Today's sales cleared");
});
$("#resetAll").addEventListener("click",()=>{
  if(!confirm("Reset ALL data — products, prices, stock and every sale — back to defaults?"))return;
  products=SEED.map(p=>({...p}));sales=[];cart=[];
  save(LS_PROD,products);save(LS_SALES,sales);
  renderGrid();renderCart();renderSettings();toast("Everything reset");
});

/* ---------------- init ---------------- */
renderGrid();renderCart();
</script>
</body>
</html>
