.body{display:flex;min-height:0;flex:1}.side{width:222px;flex:none;background:#fff;border-right:1px solid var(--line);padding:14px 10px}.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:11px;text-align:left;font-weight:700;font-size:13px;margin-bottom:4px}.nav.active{background:#e8f1fb;color:var(--blue)}.nav-icon{width:22px;text-align:center;font-size:17px}.main{min-width:0;flex:1;overflow:auto;padding:17px 16px 90px}.content{max-width:1050px;margin:0 auto}.bottomnav{display:none}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:0 3px 10px #13274009}.card h2,.card h3{margin:0;color:var(--blue)}.card h2{font-size:16px}.card h3{font-size:14px}.muted{color:var(--muted)}.small{font-size:12px}.asset-card{cursor:pointer;min-height:150px}.asset-head{display:flex;gap:10px;align-items:flex-start}.asset-icon{width:45px;height:45px;border-radius:13px;background:#e8f1fb;color:var(--blue);display:grid;place-items:center;font-size:23px;flex:none}.asset-card h3{margin:1px 0 3px}.asset-code{font-size:11px;color:var(--muted)}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.chip{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800;background:#edf1f5;color:#596574}.chip.green{background:#e2f5ea;color:var(--green)}.chip.amber{background:#fff0d6;color:var(--amber)}.chip.red{background:#fde5e1;color:var(--red)}.chip.blue{background:#e4effb;color:var(--blue)}.meta-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.meta-grid div{min-width:0}.meta-grid b{display:block;font-size:10px;color:var(--muted);font-weight:600}.meta-grid span{display:block;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #b8c8d8;border-radius:14px;background:#f9fbfd}.empty strong{display:block;color:var(--blue);margin-bottom:6px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.field,.filters input,.filters select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}.filters input{max-width:330px}.filters select{max-width:190px}.field-label{display:block;color:var(--muted);font-size:11px;font-weight:700;margin:10px 0 4px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.form-full{grid-column:1/-1}.toolbar-card{margin-bottom:12px}.notice{padding:11px 13px;border-radius:11px;background:#fff5df;color:#80500a;font-size:12px;margin-bottom:12px}.list{display:flex;flex-direction:column;gap:8px}.list-row{display:flex;align-items:center;gap:10px;padding:11px 12px;background:#fff;border:1px solid var(--line);border-radius:11px}.list-row .grow{min-width:0}.list-row b{font-size:13px}.list-row small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.amount{font-weight:800;color:var(--blue);white-space:nowrap}.table-like{overflow:auto}.simple-table{width:100%;border-collapse:collapse;font-size:12px}.simple-table th,.simple-table td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;white-space:nowrap}.simple-table th{font-size:10px;color:var(--muted);text-transform:uppercase}
.modal-back{position:fixed;inset:0;background:#0f172a66;z-index:20;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(600px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:16px 18px 24px}.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}.modal-head h2{margin:0;color:var(--blue);font-size:18px}.close{margin-left:auto;border:0;background:#f1f4f8;border-radius:8px;width:32px;height:32px;font-size:20px;color:var(--muted)}
html[dir=rtl] .topbar,html[dir=rtl] .main{direction:rtl}html[dir=rtl] .side{border-right:0;border-left:1px solid var(--line)}html[dir=rtl] .nav{text-align:right}html[dir=rtl] .simple-table th,html[dir=rtl] .simple-table td{text-align:right}html[dir=rtl] .title-row,html[dir=rtl] .asset-head,html[dir=rtl] .list-row{direction:rtl}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.side{width:190px}}
@media(max-width:680px){.topbar{height:58px;padding:8px 10px}.brand-sub,.user-name{display:none}.logo-small{width:38px;height:38px}.side{display:none}.main{padding:14px 11px 78px}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;height:62px;background:#fff;border-top:1px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom)}.bottomnav .nav{margin:0;padding:7px 2px;display:flex;flex-direction:column;gap:2px;justify-content:center;align-items:center;text-align:center;border-radius:0;font-size:9px}.bottomnav .nav-icon{font-size:17px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{padding:12px 7px}.grid{grid-template-columns:1fr}.title-row{align-items:flex-start;flex-wrap:wrap}.title-row .grow{flex-basis:calc(100% - 20px)}.title-actions{width:100%}.form-grid{grid-template-columns:1fr}.form-full{grid-column:auto}.filters input,.filters select{max-width:none;flex:1;min-width:130px}}
</style>

<script>
const firebaseConfig={apiKey:'AIzaSyBjX0Og0ZkqEdcHwOT7xF-uoKA9h6goW9o',authDomain:'oza-accommodation.firebaseapp.com',projectId:'oza-accommodation',storageBucket:'oza-accommodation.firebasestorage.app',messagingSenderId:'254994568068',appId:'1:254994568068:web:21a7109524edc09c4b43d1'};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const C={assets:'fleetAssets',maintenance:'fleetMaintenance',inspections:'fleetInspections',documents:'fleetDocuments',users:'fleetUsers'};
const state={page:'dashboard',lang:localStorage.getItem('oza_fleet_lang')||'en',user:null,assets:[],maintenance:[],inspections:[],documents:[],search:'',status:'All',category:'All',unsubs:[]};
const I={dashboard:'⌂',assets:'▣',maintenance:'⚙',inspections:'✓',documents:'▤',settings:'⚙'};
const labels={en:{Dashboard:'Dashboard',Assets:'Assets',Maintenance:'Maintenance',Inspections:'Inspections',Documents:'Documents',Settings:'Settings',TotalAssets:'Total Assets',Available:'Available',Assigned:'Assigned / In Use',Workshop:'In Workshop',ServiceDue:'Service Due',DocumentsDue:'Documents Due',AddAsset:'Add Asset',SearchAssets:'Search assets…',AllStatus:'All statuses',AllCategories:'All categories',AssetRegister:'Asset Register',NoAssets:'No assets added yet',AddFirst:'Add your first vehicle or equipment to start the register.',English:'EN',Arabic:'العربية',Logout:'Logout',OZAFleets:'OZA Fleets',FleetManagement:'Fleet & Equipment Management',AssetDetails:'Asset Details',Save:'Save',Cancel:'Cancel',AssetID:'Asset ID',AssetName:'Asset name',Category:'Category',PlateSerial:'Plate / Serial No.',Site:'Current site / location',Status:'Status',MeterType:'Meter type',MeterReading:'Current reading',AssignedTo:'Responsible person',NextServiceDate:'Next service date',NextServiceMeter:'Next service meter',RegistrationExpiry:'Registration / inspection expiry',Notes:'Notes',Vehicle:'Vehicle',HeavyEquipment:'Heavy Equipment',SiteEquipment:'Site Equipment',Other:'Other',AvailableStatus:'Available',AssignedStatus:'Assigned',InUse:'In Use',WorkshopStatus:'In Workshop',Breakdown:'Breakdown',OutOfService:'Out of Service',SelectAsset:'Select asset',ServiceType:'Service type',ServiceDate:'Service date',Cost:'Cost',NextDue:'Next due date',Description:'Description',AddMaintenance:'Add Maintenance',RecentMaintenance:'Recent Maintenance',NoMaintenance:'No maintenance records yet.',AddInspection:'Add Inspection',Result:'Result',Passed:'Passed',PassedRemarks:'Passed with remarks',Failed:'Failed',Defect:'Defect / remarks',NoInspections:'No inspection records yet.',AddDocument:'Add Document',DocumentType:'Document type',ExpiryDate:'Expiry date',NoDocuments:'No documents yet.',DocumentAlerts:'Expiring documents',NoAlerts:'No documents due within 30 days.',Code:'Access code',Unlock:'Unlock',InvalidCode:'Invalid access code',FirstLogin:'First-use prototype code: 1234',PrototypeNote:'Prototype foundation — fleet data is separate from OZA Staffs.',Role:'Role',SuperAdmin:'Super Admin'},ar:{Dashboard:'لوحة التحكم',Assets:'الأصول',Maintenance:'الصيانة',Inspections:'الفحوصات',Documents:'المستندات',Settings:'الإعدادات',TotalAssets:'إجمالي الأصول',Available:'متاحة',Assigned:'معينة / قيد الاستخدام',Workshop:'في الورشة',ServiceDue:'الصيانة المستحقة',DocumentsDue:'المستندات المستحقة',AddAsset:'إضافة أصل',SearchAssets:'البحث في الأصول…',AllStatus:'كل الحالات',AllCategories:'كل الفئات',AssetRegister:'سجل الأصول',NoAssets:'لا توجد أصول بعد',AddFirst:'أضف أول مركبة أو معدة لبدء السجل.',English:'EN',Arabic:'العربية',Logout:'خروج',OZAFleets:'أسطول OZA',FleetManagement:'إدارة المركبات والمعدات',AssetDetails:'تفاصيل الأصل',Save:'حفظ',Cancel:'إلغاء',AssetID:'رقم الأصل',AssetName:'اسم الأصل',Category:'الفئة',PlateSerial:'اللوحة / الرقم التسلسلي',Site:'الموقع الحالي',Status:'الحالة',MeterType:'نوع العداد',MeterReading:'القراءة الحالية',AssignedTo:'المسؤول',NextServiceDate:'موعد الصيانة القادم',NextServiceMeter:'قراءة الصيانة القادمة',RegistrationExpiry:'انتهاء التسجيل / الفحص',Notes:'ملاحظات',Vehicle:'مركبة',HeavyEquipment:'معدات ثقيلة',SiteEquipment:'معدات موقع',Other:'أخرى',AvailableStatus:'متاحة',AssignedStatus:'معينة',InUse:'قيد الاستخدام',WorkshopStatus:'في الورشة',Breakdown:'عطل',OutOfService:'خارج الخدمة',SelectAsset:'اختر الأصل',ServiceType:'نوع الخدمة',ServiceDate:'تاريخ الخدمة',Cost:'التكلفة',NextDue:'الموعد القادم',Description:'الوصف',AddMaintenance:'إضافة صيانة',RecentMaintenance:'أحدث أعمال الصيانة',NoMaintenance:'لا توجد سجلات صيانة بعد.',AddInspection:'إضافة فحص',Result:'النتيجة',Passed:'ناجح',PassedRemarks:'ناجح مع ملاحظات',Failed:'فشل',Defect:'العطل / الملاحظات',NoInspections:'لا توجد سجلات فحص بعد.',AddDocument:'إضافة مستند',DocumentType:'نوع المستند',ExpiryDate:'تاريخ الانتهاء',NoDocuments:'لا توجد مستندات بعد.',DocumentAlerts:'المستندات القريبة من الانتهاء',NoAlerts:'لا توجد مستندات مستحقة خلال 30 يوماً.',Code:'رمز الدخول',Unlock:'دخول',InvalidCode:'رمز الدخول غير صحيح',FirstLogin:'رمز النموذج الأولي: 1234',PrototypeNote:'نسخة أولية — بيانات الأسطول منفصلة عن تطبيق الموظفين.',Role:'الدور',SuperAdmin:'المشرف العام'}};
function t(k){return (labels[state.lang]||labels.en)[k]||k}function $(s){return document.querySelector(s)}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function fmtDate(v){if(!v)return '—';const d=v.toDate?v.toDate():new Date(v);return isNaN(d)?'—':d.toLocaleDateString(state.lang==='ar'?'ar-SA':'en-GB',{day:'2-digit',month:'short',year:'numeric'})}function daysUntil(v){if(!v)return 9999;return Math.ceil((new Date(v).setHours(0,0,0,0)-new Date().setHours(0,0,0,0))/86400000)}function assetName(id){const a=state.assets.find(x=>x.id===id);return a?a.name||a.assetId||id:'Unknown asset'}
function setLang(l){state.lang=l;localStorage.setItem('oza_fleet_lang',l);document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';render()}
function statusClass(s){return /break|out/i.test(s||'')?'red':/workshop|due/i.test(s||'')?'amber':/available/i.test(s||'')?'green':/assigned|use/i.test(s||'')?'blue':''}function iconFor(cat){return /heavy/i.test(cat||'')?'⚒':/site/i.test(cat||'')?'⚙':'▣'}
function navItem(page,icon,label){return `<button class="nav ${state.page===page?'active':''}" data-nav="${page}"><span class="nav-icon">${icon}</span><span>${t(label)}</span></button>`}
function shell(){return `<div class="shell"><header class="topbar"><div class="logo-small">OZA</div><div><div class="brand-title">${t('OZAFleets')}</div><div class="brand-sub">${t('FleetManagement')}</div></div><div class="grow"></div><div class="user-name">${esc(state.user?.name||'')}</div><button class="lang" id="langBtn">${state.lang==='en'?'العربية':'EN'}</button><button class="logout" id="logoutBtn" title="${t('Logout')}">↪</button></header><div class="body"><aside class="side">${navItem('dashboard','⌂','Dashboard')}${navItem('assets','▣','Assets')}${navItem('maintenance','⚙','Maintenance')}${navItem('inspections','✓','Inspections')}${navItem('documents','▤','Documents')}${navItem('settings','⚙','Settings')}</aside><main class="main"><div class="content" id="content"></div></main></div><nav class="bottomnav">${navItem('dashboard','⌂','Dashboard')}${navItem('assets','▣','Assets')}${navItem('maintenance','⚙','Maintenance')}${navItem('inspections','✓','Inspections')}${navItem('documents','▤','Documents')}</nav></div>`}
function stats(){const due=state.assets.filter(a=>daysUntil(a.nextServiceDate)<=30).length;const docs=state.documents.filter(d=>daysUntil(d.expiryDate)<=30).length;return `<div class="stats"><div class="stat"><strong>${state.assets.length}</strong><span>${t('TotalAssets')}</span></div><div class="stat"><strong>${state.assets.filter(a=>a.status==='Available').length}</strong><span>${t('Available')}</span></div><div class="stat"><strong>${state.assets.filter(a=>['Assigned','In Use'].includes(a.status)).length}</strong><span>${t('Assigned')}</span></div><div class="stat"><strong>${state.assets.filter(a=>a.status==='In Workshop').length}</strong><span>${t('Workshop')}</span></div><div class="stat ${due?'alert':''}"><strong>${due}</strong><span>${t('ServiceDue')}</span></div><div class="stat ${docs?'alert':''}"><strong>${docs}</strong><span>${t('DocumentsDue')}</span></div></div>`}
function dashboard(){const due=state.assets.filter(a=>daysUntil(a.nextServiceDate)<=30);const docs=state.documents.filter(d=>daysUntil(d.expiryDate)<=30);return `<div class="title-row"><div class="grow"><h1>${t('Dashboard')}</h1><p>${t('PrototypeNote')}</p></div><button class="btn primary" data-action="add-asset">＋ ${t('AddAsset')}</button></div>${stats()}<div class="grid"><section class="card"><h2>${t('AssetRegister')}</h2><p class="muted small">${state.assets.length?state.assets.slice(0,6).map(assetMini).join(''):`<div class="empty"><strong>${t('NoAssets')}</strong>${t('AddFirst')}</div>`}</p></section><section class="card"><h2>${t('RecentMaintenance')}</h2>${state.maintenance.length?state.maintenance.slice().sort((a,b)=>String(b.serviceDate).localeCompare(String(a.serviceDate))).slice(0,6).map(m=>`<div class="list-row"><div class="grow"><b>${esc(assetName(m.assetId))}</b><small>${esc(m.serviceType||'Service')} · ${fmtDate(m.serviceDate)}</small></div><span class="amount">${m.cost?esc(m.cost):'—'}</span></div>`).join(''):`<div class="empty" style="margin-top:10px">${t('NoMaintenance')}</div>`}</section><section class="card"><h2>${t('ServiceDue')}</h2>${due.length?due.slice(0,6).map(a=>`<div class="list-row"><div class="grow"><b>${esc(a.name||a.assetId)}</b><small>${fmtDate(a.nextServiceDate)} · ${esc(a.nextServiceMeter||'')}</small></div><span class="chip amber">${daysUntil(a.nextServiceDate)<0?'OVERDUE':daysUntil(a.nextServiceDate)+'d'}</span></div>`).join(''):`<div class="empty" style="margin-top:10px">${t('NoAlerts')}</div>`}</section><section class="card"><h2>${t('DocumentAlerts')}</h2>${docs.length?docs.slice(0,6).map(d=>`<div class="list-row"><div class="grow"><b>${esc(d.documentType||'Document')}</b><small>${esc(assetName(d.assetId))} · ${fmtDate(d.expiryDate)}</small></div><span class="chip red">${daysUntil(d.expiryDate)<0?'EXPIRED':daysUntil(d.expiryDate)+'d'}</span></div>`).join(''):`<div class="empty" style="margin-top:10px">${t('NoAlerts')}</div>`}</section></div>`}
function assetMini(a){return `<div class="list-row" data-asset="${esc(a.id)}"><div class="asset-icon" style="width:34px;height:34px;font-size:16px">${iconFor(a.category)}</div><div class="grow"><b>${esc(a.name||a.assetId)}</b><small>${esc(a.assetId||'')} · ${esc(a.site||'—')}</small></div><span class="chip ${statusClass(a.status)}">${esc(a.status||'—')}</span></div>`}
function assetCard(a){return `<article class="card asset-card" data-asset="${esc(a.id)}"><div class="asset-head"><div class="asset-icon">${iconFor(a.category)}</div><div class="grow"><h3>${esc(a.name||a.assetId)}</h3><div class="asset-code">${esc(a.assetId||'')} · ${esc(a.plateSerial||'No plate/serial')}</div></div><span class="chip ${statusClass(a.status)}">${esc(a.status||'—')}</span></div><div class="chips"><span class="chip blue">${esc(a.category||'—')}</span>${a.site?`<span class="chip">${esc(a.site)}</span>`:''}</div><div class="meta-grid"><div><b>${t('AssignedTo')}</b><span>${esc(a.assignedTo||'—')}</span></div><div><b>${t('NextServiceDate')}</b><span>${fmtDate(a.nextServiceDate)}</span></div></div></article>`}
function assetsPage(){let list=state.assets.filter(a=>(state.status==='All'||a.status===state.status)&&(state.category==='All'||a.category===state.category)&&(!state.search||JSON.stringify(a).toLowerCase().includes(state.search.toLowerCase())));const statuses=['All',...new Set(state.assets.map(a=>a.status).filter(Boolean))];const cats=['All',...new Set(state.assets.map(a=>a.category).filter(Boolean))];return `<div class="title-row"><div class="grow"><h1>${t('Assets')}</h1><p>${state.assets.length} ${t('TotalAssets')}</p></div><button class="btn primary" data-action="add-asset">＋ ${t('AddAsset')}</button></div><div class="card toolbar-card"><div class="filters"><input id="assetSearch" placeholder="${t('SearchAssets')}" value="${esc(state.search)}"> <select id="statusFilter">${statuses.map(s=>`<option ${s===state.status?'selected':''} value="${esc(s)}">${s==='All'?t('AllStatus'):esc(s)}</option>`).join('')}</select><select id="categoryFilter">${cats.map(s=>`<option ${s===state.category?'selected':''} value="${esc(s)}">${s==='All'?t('AllCategories'):esc(s)}</option>`).join('')}</select></div></div>${list.length?`<div class="grid">${list.map(assetCard).join('')}</div>`:`<div class="empty"><strong>${t('NoAssets')}</strong>${t('AddFirst')}</div>`}`}
function maintenancePage(){return `<div class="title-row"><div class="grow"><h1>${t('Maintenance')}</h1><p>${state.maintenance.length} records</p></div><button class="btn primary" data-action="add-maintenance">＋ ${t('AddMaintenance')}</button></div>${state.maintenance.length?`<div class="list">${state.maintenance.slice().sort((a,b)=>String(b.serviceDate).localeCompare(String(a.serviceDate))).map(m=>`<div class="list-row"><div class="asset-icon" style="width:38px;height:38px;font-size:17px">⚙</div><div class="grow"><b>${esc(assetName(m.assetId))}</b><small>${esc(m.serviceType||'Service')} · ${fmtDate(m.serviceDate)}${m.description?' · '+esc(m.description):''}</small></div><span class="amount">${m.cost?esc(m.cost):'—'}</span></div>`).join('')}</div>`:`<div class="empty"><strong>${t('NoMaintenance')}</strong>${t('AddMaintenance')}</div>`}`}
function inspectionsPage(){return `<div class="title-row"><div class="grow"><h1>${t('Inspections')}</h1><p>${state.inspections.length} records</p></div><button class="btn primary" data-action="add-inspection">＋ ${t('AddInspection')}</button></div>${state.inspections.length?`<div class="list">${state.inspections.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(i=>`<div class="list-row"><div class="asset-icon" style="width:38px;height:38px;font-size:17px">✓</div><div class="grow"><b>${esc(assetName(i.assetId))}</b><small>${fmtDate(i.date)} · ${esc(i.defect||'No defects')}</small></div><span class="chip ${i.result==='Failed'?'red':i.result==='Passed with remarks'?'amber':'green'}">${esc(i.result||'—')}</span></div>`).join('')}</div>`:`<div class="empty"><strong>${t('NoInspections')}</strong>${t('AddInspection')}</div>`}`}
function documentsPage(){return `<div class="title-row"><div class="grow"><h1>${t('Documents')}</h1><p>${state.documents.length} records</p></div><button class="btn primary" data-action="add-document">＋ ${t('AddDocument')}</button></div>${state.documents.length?`<div class="list">${state.documents.slice().sort((a,b)=>String(a.expiryDate).localeCompare(String(b.expiryDate))).map(d=>`<div class="list-row"><div class="asset-icon" style="width:38px;height:38px;font-size:17px">▤</div><div class="grow"><b>${esc(d.documentType||'Document')}</b><small>${esc(assetName(d.assetId))} · ${fmtDate(d.expiryDate)}</small></div><span class="chip ${daysUntil(d.expiryDate)<=30?'red':'green'}">${daysUntil(d.expiryDate)<0?'Expired':fmtDate(d.expiryDate)}</span></div>`).join('')}</div>`:`<div class="empty"><strong>${t('NoDocuments')}</strong>${t('AddDocument')}</div>`}`}
function settingsPage(){return `<div class="title-row"><div class="grow"><h1>${t('Settings')}</h1><p>${t('PrototypeNote')}</p></div></div><section class="card"><h2>${t('Settings')}</h2><div class="meta-grid"><div><b>${t('Role')}</b><span>${t('SuperAdmin')}</span></div><div><b>${t('Code')}</b><span>••••</span></div><div><b>Data</b><span>Separate Fleet collections</span></div><div><b>Language</b><span>${state.lang==='en'?'English':'العربية'}</span></div></div><div class="notice" style="margin-top:14px">${t('PrototypeNote')}</div></section>`}
function modal(title,body){const x=document.createElement('div');x.className='modal-back';x.innerHTML=`<div class="modal"><div class="modal-head"><h2>${title}</h2><button class="close">×</button></div>${body}</div>`;x.querySelector('.close').onclick=()=>x.remove();document.body.appendChild(x);return x}
function field(key,type='text',value='',extra=''){return `<label class="field-label">${t(key)}<input class="field" name="${key}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function assetModal(){const x=modal(t('AddAsset'),`<form id="assetForm"><div class="form-grid">${field('AssetID','text','', 'required')}${field('AssetName','text','', 'required')}<label class="field-label">${t('Category')}<select class="field" name="Category"><option>${t('Vehicle')}</option><option>${t('HeavyEquipment')}</option><option>${t('SiteEquipment')}</option><option>${t('Other')}</option></select></label>${field('PlateSerial')}${field('Site')}<label class="field-label">${t('Status')}<select class="field" name="Status"><option>Available</option><option>Assigned</option><option>In Use</option><option>In Workshop</option><option>Breakdown</option><option>Out of Service</option></select></label><label class="field-label">${t('MeterType')}<select class="field" name="MeterType"><option>Odometer</option><option>Engine hours</option><option>Both</option></select></label>${field('MeterReading','number','0')}${field('AssignedTo')}${field('NextServiceDate','date')}${field('NextServiceMeter','number')}${field('RegistrationExpiry','date')}<label class="field-label form-full">${t('Notes')}<textarea class="field" name="Notes" rows="3"></textarea></label></div><button class="btn primary wide">${t('Save')}</button></form>`);x.querySelector('#assetForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const data={assetId:f.get('AssetID'),name:f.get('AssetName'),category:f.get('Category'),plateSerial:f.get('PlateSerial'),site:f.get('Site'),status:f.get('Status'),meterType:f.get('MeterType'),meterReading:f.get('MeterReading'),assignedTo:f.get('AssignedTo'),nextServiceDate:f.get('NextServiceDate'),nextServiceMeter:f.get('NextServiceMeter'),registrationExpiry:f.get('RegistrationExpiry'),notes:f.get('Notes'),createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdBy:state.user?.name||'Super Admin'};await db.collection(C.assets).add(data);x.remove()}}
function maintenanceModal(){const x=modal(t('AddMaintenance'),`<form id="maintenanceForm"><div class="form-grid"><label class="field-label form-full">${t('SelectAsset')}<select class="field" name="assetId" required>${state.assets.map(a=>`<option value="${a.id}">${esc(a.name||a.assetId)} — ${esc(a.assetId||'')}</option>`).join('')}</select></label>${field('ServiceType','text','Oil change','required')}${field('ServiceDate','date',new Date().toISOString().slice(0,10),'required')}${field('MeterReading','number')}${field('Cost','text')}${field('NextDue','date')}<label class="field-label form-full">${t('Description')}<textarea class="field" name="Description" rows="3"></textarea></label></div><button class="btn primary wide">${t('Save')}</button></form>`);x.querySelector('#maintenanceForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await db.collection(C.maintenance).add({assetId:f.get('assetId'),serviceType:f.get('ServiceType'),serviceDate:f.get('ServiceDate'),meterReading:f.get('MeterReading'),cost:f.get('Cost'),nextDue:f.get('NextDue'),description:f.get('Description'),createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdBy:state.user?.name||'Super Admin'});if(f.get('NextDue'))await db.collection(C.assets).doc(f.get('assetId')).set({nextServiceDate:f.get('NextDue'),lastServiceDate:f.get('ServiceDate'),lastServiceMeter:f.get('MeterReading')},{merge:true});x.remove()}}
function inspectionModal(){const x=modal(t('AddInspection'),`<form id="inspectionForm"><div class="form-grid"><label class="field-label form-full">${t('SelectAsset')}<select class="field" name="assetId" required>${state.assets.map(a=>`<option value="${a.id}">${esc(a.name||a.assetId)}</option>`).join('')}</select></label>${field('ServiceDate','date',new Date().toISOString().slice(0,10),'required')}<label class="field-label">${t('Result')}<select class="field" name="result"><option>Passed</option><option>Passed with remarks</option><option>Failed</option></select></label><label class="field-label form-full">${t('Defect')}<textarea class="field" name="defect" rows="3"></textarea></label></div><button class="btn primary wide">${t('Save')}</button></form>`);x.querySelector('#inspectionForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await db.collection(C.inspections).add({assetId:f.get('assetId'),date:f.get('ServiceDate'),result:f.get('result'),defect:f.get('defect'),createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdBy:state.user?.name||'Super Admin'});x.remove()}}
function documentModal(){const x=modal(t('AddDocument'),`<form id="documentForm"><div class="form-grid"><label class="field-label form-full">${t('SelectAsset')}<select class="field" name="assetId" required>${state.assets.map(a=>`<option value="${a.id}">${esc(a.name||a.assetId)}</option>`).join('')}</select></label>${field('DocumentType','text','Registration / Insurance','required')}${field('ExpiryDate','date','', 'required')}<label class="field-label form-full">${t('Notes')}<textarea class="field" name="notes" rows="3"></textarea></label></div><button class="btn primary wide">${t('Save')}</button></form>`);x.querySelector('#documentForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await db.collection(C.documents).add({assetId:f.get('assetId'),documentType:f.get('DocumentType'),expiryDate:f.get('ExpiryDate'),notes:f.get('notes'),createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdBy:state.user?.name||'Super Admin'});x.remove()}}
function showLogin(){document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';document.getElementById('app').innerHTML=`<div class="pin"><div class="pin-card"><div class="brand-mark">OZA</div><h1>${t('OZAFleets')}</h1><p>${t('FleetManagement')}</p><input id="code" type="password" inputmode="numeric" maxlength="8" placeholder="••••"><div class="error" id="pinError"></div><button class="btn primary wide" id="unlock">${t('Unlock')}</button><button class="btn ghost wide" id="loginLang">${state.lang==='en'?'العربية':'EN'}</button><p class="small muted">${t('FirstLogin')}</p></div></div>`;$('#unlock').onclick=unlock;$('#code').onkeydown=e=>{if(e.key==='Enter')unlock()};$('#loginLang').onclick=()=>setLang(state.lang==='en'?'ar':'en')}
async function ensureAuth(){if(!firebase.auth().currentUser)await firebase.auth().signInAnonymously()}
async function unlock(){const code=$('#code').value.trim();if(!code)return;await ensureAuth();let snap=await db.collection(C.users).where('code','==',code).where('active','==',true).limit(1).get();if(snap.empty&&code==='1234'){await db.collection(C.users).doc('fleet-super-admin').set({name:'Fleet Super Admin',code:'1234',role:'superadmin',active:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});snap=await db.collection(C.users).doc('fleet-super-admin').get();snap={empty:!snap.exists,docs:snap.exists?[snap]:[]}}if(snap.empty){$('#pinError').textContent=t('InvalidCode');return}state.user={id:snap.docs[0].id,...snap.docs[0].data()};sessionStorage.setItem('oza_fleet_unlocked','1');start();}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.page=b.dataset.nav;render()});$('#langBtn')?.addEventListener('click',()=>setLang(state.lang==='en'?'ar':'en'));$('#logoutBtn')?.addEventListener('click',()=>{sessionStorage.removeItem('oza_fleet_unlocked');location.reload()});document.querySelectorAll('[data-action="add-asset"]').forEach(b=>b.onclick=assetModal);document.querySelectorAll('[data-action="add-maintenance"]').forEach(b=>b.onclick=maintenanceModal);document.querySelectorAll('[data-action="add-inspection"]').forEach(b=>b.onclick=inspectionModal);document.querySelectorAll('[data-action="add-document"]').forEach(b=>b.onclick=documentModal);document.querySelectorAll('[data-asset]').forEach(x=>x.onclick=()=>{const a=state.assets.find(y=>y.id===x.dataset.asset);if(a)assetDetail(a)});$('#assetSearch')?.addEventListener('input',e=>{state.search=e.target.value;render()});$('#statusFilter')?.addEventListener('change',e=>{state.status=e.target.value;render()});$('#categoryFilter')?.addEventListener('change',e=>{state.category=e.target.value;render()})}
function assetDetail(a){const x=modal(t('AssetDetails'),`<div class="asset-head"><div class="asset-icon">${iconFor(a.category)}</div><div><h3>${esc(a.name||a.assetId)}</h3><div class="asset-code">${esc(a.assetId||'')} · ${esc(a.plateSerial||'')}</div></div></div><div class="chips"><span class="chip ${statusClass(a.status)}">${esc(a.status||'—')}</span><span class="chip blue">${esc(a.category||'—')}</span></div><div class="meta-grid"><div><b>${t('Site')}</b><span>${esc(a.site||'—')}</span></div><div><b>${t('AssignedTo')}</b><span>${esc(a.assignedTo||'—')}</span></div><div><b>${t('MeterReading')}</b><span>${esc(a.meterReading||'—')} ${esc(a.meterType||'')}</span></div><div><b>${t('NextServiceDate')}</b><span>${fmtDate(a.nextServiceDate)}</span></div><div><b>${t('RegistrationExpiry')}</b><span>${fmtDate(a.registrationExpiry)}</span></div><div><b>${t('Notes')}</b><span>${esc(a.notes||'—')}</span></div></div><button class="btn primary wide" data-action="add-maintenance">＋ ${t('AddMaintenance')}</button>`);x.querySelector('[data-action="add-maintenance"]').onclick=()=>{x.remove();maintenanceModal()}}
function render(){if(!state.user){showLogin();return}document.getElementById('app').innerHTML=shell();const c=$('#content');c.innerHTML=state.page==='dashboard'?dashboard():state.page==='assets'?assetsPage():state.page==='maintenance'?maintenancePage():state.page==='inspections'?inspectionsPage():state.page==='documents'?documentsPage():settingsPage();bind()}
function start(){state.unsubs.forEach(u=>u());state.unsubs=[];for(const [key,col] of Object.entries(C)){if(key==='users')continue;state.unsubs.push(db.collection(col).onSnapshot(s=>{state[key]=s.docs.map(d=>({id:d.id,...d.data()}));render()}))}render()}
(async()=>{try{await ensureAuth();if(sessionStorage.getItem('oza_fleet_unlocked')==='1'){const s=await db.collection(C.users).doc('fleet-super-admin').get();state.user=s.exists?{id:s.id,...s.data()}:{name:'Fleet Super Admin',role:'superadmin'};start()}else{showLogin()}}catch(e){console.error(e);showLogin()}})();
</script>
</body>
</html>
