<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>OZA Staff Accommodation Register</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0952a1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OZA Staffs">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --blue: #0952a1;
  --blue-dark: #063a73;
  --bg: #eef2f7;
  --card: #ffffff;
  --ink: #1a2333;
  --muted: #6b7684;
  --border: #e2e6ec;
  --green: #1e8e5a;
  --amber: #b5650c;
  --red: #c0392b;
  --grey: #55606c;
  --radius: 14px;
}
* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
}
#app-root { height: 100%; }
.boot-loading { height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, var(--blue-dark), var(--blue)); }
.boot-spinner { width: 34px; height: 34px; border: 3px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: boot-spin .8s linear infinite; }
@keyframes boot-spin { to { transform: rotate(360deg); } }

/* PIN screen */
.pin-screen { height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; background: linear-gradient(180deg, var(--blue-dark), var(--blue)); overflow-y: auto; }
.pin-card { background: var(--card); border-radius: var(--radius); padding: 32px 24px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
.pin-logo { max-width: 190px; margin-bottom: 14px; }
.pin-card h1 { font-size: 20px; margin: 4px 0 2px; }
.pin-input-wrap { position: relative; margin: 16px 0; }
.pin-input { width: 100%; text-align: center; font-size: 28px; letter-spacing: 8px; padding: 14px 44px; border: 1px solid var(--border); border-radius: 10px; }
.pin-toggle { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: none; background: none; color: var(--muted); width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
.pin-toggle svg { width: 20px; height: 20px; }
.error-text { color: var(--red); font-size: 13px; margin-top: 8px; }

/* Shell — .app-shell owns the viewport height; .topbar and .tabbar are fixed-size
   flex children, .view is the only part that scrolls, which lets a sticky
   sub-header inside .view stick reliably under the topbar. */
.app-shell { display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding-top: env(safe-area-inset-top, 0px); }
.topbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #fff; color: var(--blue); border-bottom: 1px solid var(--border); box-shadow: 0 2px 6px rgba(20,30,50,.06); flex-shrink: 0; z-index: 3; }
.topbar-logo { height: 34px; flex-shrink: 0; }
.topbar-title { font-weight: 700; font-size: 13px; line-height: 1.25; color: var(--blue); }
.topbar-title div:first-child { font-size: 14px; }
.topbar-title div:last-child { font-weight: 500; color: var(--muted); font-size: 11px; }
.topbar-spacer { flex: 1; }
.topbar-user { font-size: 12px; font-weight: 600; color: var(--ink); max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
.logout-btn { border: none; background: #f0f2f5; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--blue); flex-shrink: 0; }
.logout-btn svg { width: 18px; height: 18px; }
.view { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 14px 90px; }
.view > * { max-width: 720px; margin-left: auto; margin-right: auto; }
.section.sticky-header { position: sticky; top: -4px; padding: 8px 0 6px; background: var(--bg); z-index: 5; }
.tabbar { flex-shrink: 0; display: flex; background: #fff; border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tab-btn { flex: 1; border: none; background: none; padding: 8px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: 11px; cursor: pointer; }
.tab-btn.active { color: var(--blue); font-weight: 600; }
.tab-icon { width: 21px; height: 21px; display: flex; align-items: center; justify-content: center; }
.tab-icon svg { width: 21px; height: 21px; }
.tab-label { line-height: 1.2; }

/* Layout blocks */
.section { margin: 16px 0; }
.section-title { font-size: 13px; font-weight: 700; text-transform: none; color: #4a6d94; margin-bottom: 8px; }
.page-title { font-size: 20px; font-weight: 700; margin: 6px 0 2px; color: var(--blue); }
.muted { color: var(--muted); font-size: 13px; }
.muted.small { font-size: 11px; margin-top: 6px; }
.back-btn { border: none; background: none; color: var(--blue); font-size: 14px; padding: 4px 0 8px; cursor: pointer; }

/* Stat row */
.stat-row { display: flex; gap: 10px; }
.stat-box { flex: 1; background: linear-gradient(180deg, #ffffff, #f5f9fd); border-radius: var(--radius); padding: 14px 8px; text-align: center; border: 1px solid #dbe6f2; box-shadow: 0 2px 6px rgba(9,82,161,.08), 0 1px 0 rgba(255,255,255,.6) inset; }
.stat-box-click { cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; }
.stat-box-click:active { transform: translateY(1px); box-shadow: 0 1px 3px rgba(9,82,161,.10); }
.stat-num { font-size: 22px; font-weight: 800; color: var(--blue); }
.stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* Cards */
.card { background: linear-gradient(180deg, #ffffff, #fbfcfe); border-radius: var(--radius); padding: 14px; border: 1px solid #d9e4f0; box-shadow: 0 2px 6px rgba(20,30,50,.06); }
.card-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.building-card { cursor: pointer; border: 1.5px solid #a9c8e8; overflow: hidden; box-shadow: 0 4px 12px rgba(9,82,161,.10), 0 1px 0 rgba(255,255,255,.7) inset; transition: transform .12s ease, box-shadow .12s ease; }
.building-card:active { transform: translateY(1px); box-shadow: 0 2px 6px rgba(9,82,161,.10); }
.building-name { font-weight: 700; font-size: 16px; }
.badge-stack { float: right; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; margin-left: 10px; margin-bottom: 4px; }
.building-meta { font-size: 13px; margin-top: 2px; }
.pending-flag { color: var(--amber); font-weight: 600; }
.vacation-banner { cursor: pointer; border-left: 4px solid var(--amber); font-size: 13px; }
.badge { font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.badge-vacant { background: linear-gradient(180deg, #fdedd2, #fbe2b8); color: var(--amber); }
.badge-full { background: linear-gradient(180deg, #dbf3e6, #c9ecd9); color: var(--green); }
.badge-empty { background: linear-gradient(180deg, #e7eaee, #dde1e6); color: var(--grey); }
.badge-over { background: linear-gradient(180deg, #fad6d0, #f6c7c0); color: var(--red); }
.verify-stale { color: var(--red); font-weight: 600; }
.room-status-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }

/* Rooms */
.room-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.room-chip { border-radius: 10px; padding: 10px 6px; text-align: center; cursor: pointer; border: 1px solid var(--border); box-shadow: 0 1px 3px rgba(20,30,50,.07); }
.room-chip-partial { background: linear-gradient(180deg, #fdefd6, #fbe2b8); border-color: #e8b562; }
.room-chip-full { background: linear-gradient(180deg, #dbf3e6, #c9ecd9); border-color: #7fcda3; }
.room-chip-empty { background: linear-gradient(180deg, #e7eaee, #dde1e6); border-color: #a9b1ba; }
.room-chip-over { background: linear-gradient(180deg, #fad6d0, #f6c7c0); border-color: #e4897a; }
.room-chip-no { font-size: 12px; font-weight: 700; }
.room-chip-count { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* Occupants */
.occupant-list { display: flex; flex-direction: column; gap: 8px; }
.occupant-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.occupant-flag { border-color: var(--red); background: #fdecea; }
.occupant-name { font-weight: 600; font-size: 14px; }
.occupant-sub { font-size: 12px; margin-top: 2px; }
.mobile-link { color: var(--blue); font-weight: 600; text-decoration: none; }
.mobile-link:active { opacity: .6; }
.occ-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
.occ-avatar-fallback { display: flex; align-items: center; justify-content: center; background: #dde6f2; color: var(--blue); font-weight: 700; font-size: 15px; }
.photo-preview { display: block; max-width: 140px; max-height: 140px; border-radius: 10px; margin: 8px 0; object-fit: cover; }
.occupant-actions { display: flex; gap: 4px; }
.occupant-main { flex: 1; min-width: 0; }
.search-result { cursor: pointer; margin-bottom: 8px; }
.icon-btn { border: none; background: #f0f2f5; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink); flex-shrink: 0; }
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn-danger { color: var(--red); }
.reconcile-row { gap: 10px; }
.reconcile-check { display: flex; align-items: center; flex-shrink: 0; }
.reconcile-bulk-row { display: flex; gap: 8px; margin-top: 10px; }
.reconcile-bulk-row .btn { flex: 1; margin-top: 0; }

/* Forms / inputs */
.field-label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
.input-inline, select.input-inline { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; background: #fff; }
.input-inline:focus, select.input-inline:focus, .search-input:focus, .pin-input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(9,82,161,.12); }
.search-input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; font-size: 15px; margin-top: 8px; }
.check-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 14px; }
.check-row input, .reconcile-check input { width: 18px; height: 18px; accent-color: var(--blue); }

/* Buttons */
.btn { border: none; border-radius: 10px; padding: 12px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn-block { width: 100%; margin-top: 10px; }
.btn-primary { background: var(--blue); color: #fff; }
.btn-outline { background: #fff; border: 1px solid var(--blue); color: var(--blue); }
.btn-danger { background: #fdecea; color: var(--red); border: 1px solid #f3b7ae; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(15,20,30,.5); display: flex; align-items: flex-end; z-index: 100; }
.modal-sheet { background: #fff; width: 100%; max-width: 480px; margin: 0 auto; border-radius: 18px 18px 0 0; padding: 16px 18px calc(24px + env(safe-area-inset-bottom, 0px)); max-height: 88vh; overflow-y: auto; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.modal-title { font-weight: 700; font-size: 16px; color: var(--blue); }
.modal-body { padding-bottom: 6px; }

/* Danger zone */
.danger-zone { border: 1px dashed #f3b7ae; border-radius: 12px; padding: 12px; }

/* Users & Permissions */
.user-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.user-card { display: flex; flex-direction: column; gap: 4px; }
.user-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
.user-card-top .badge { margin-top: 4px; display: inline-block; text-transform: capitalize; }
.perm-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
.perm-chip { display: flex; align-items: center; gap: 5px; font-size: 12px; background: #f0f2f5; padding: 5px 9px; border-radius: 999px; }
.perm-chip input { width: 15px; height: 15px; accent-color: var(--blue); }

/* Activity log */
.activity-row { padding: 8px 0; border-bottom: 1px solid var(--border); }
.activity-line { font-size: 13px; }

/* Toast */
#toast-root { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; z-index: 200; pointer-events: none; }
.toast { background: #1a2333; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; margin-top: 6px; opacity: 0; transform: translateY(-8px); transition: all .25s; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast-error { background: var(--red); }

@media (min-width: 720px) {
  .card-grid { grid-template-columns: 1fr 1fr; }
  .room-grid { grid-template-columns: repeat(5, 1fr); }
}

</style>
</head>

const state = {
  buildings: {},      // id -> {id,name,hasFloors,declaredRooms,toilets,lastVerified,verifiedBy}
  rooms: {},          // docId -> {id,buildingId,roomNo,floor,capacity,occupants:[],lastVerified,verifiedBy}
  users: {},          // docId -> {id,name,code,role,permissions}
  statusOptions: ['On Vacation'], // grows as people add custom status notes
  ready: false,
  authReady: false,
};

let unsubBuildings = null;
let unsubRooms = null;
let unsubStatusOptions = null;
let unsubUsers = null;

// ---------- Utilities ----------
function $(sel, root) { return (root || document).querySelector(sel); }
function $all(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }
function el(tag, attrs, children) {
  const node = document.createElement(tag);
  attrs = attrs || {};
  for (const k in attrs) {
    if (attrs[k] === null || attrs[k] === undefined) continue;
    if (k === 'class') node.className = attrs[k];
    else if (k === 'html') node.innerHTML = attrs[k];
    else if (k.startsWith('on') && typeof attrs[k] === 'function') node.addEventListener(k.slice(2), attrs[k]);
    else node.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(c => { if (c) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return node;
}
function roomDocId(buildingId, roomNo) { return buildingId + '__' + roomNo; }
function roomsForBuilding(buildingId) {
  return Object.values(state.rooms)
    .filter(r => r.buildingId === buildingId)
    .sort((a, b) => naturalCompare(a.roomNo, b.roomNo));
}
function naturalCompare(a, b) {
  a = String(a); b = String(b);
  const floorOrder = { GF: 0, FF: 1 };
  const ax = a.match(/^([A-Za-z]+)/);
  const bx = b.match(/^([A-Za-z]+)/);
  const aPrefix = ax ? ax[1] : '';
  const bPrefix = bx ? bx[1] : '';
  if (aPrefix || bPrefix) {
    const aRank = floorOrder[aPrefix] !== undefined ? floorOrder[aPrefix] : 99;
    const bRank = floorOrder[bPrefix] !== undefined ? floorOrder[bPrefix] : 99;
    if (aRank !== bRank) return aRank - bRank;
  }
  const aNum = parseInt((a.match(/\d+/) || ['0'])[0], 10);
  const bNum = parseInt((b.match(/\d+/) || ['0'])[0], 10);
  return aNum - bNum;
}
function occupantCount(room) { return (room.occupants || []).length; }
function vacantCount(room) { return Math.max(0, (room.capacity || 0) - occupantCount(room)); }
function overCount(room) { return Math.max(0, occupantCount(room) - (room.capacity || 0)); }
function roomStatus(room) {
  const occ = occupantCount(room), cap = room.capacity || 0;
  if (occ === 0) return 'empty';
  if (occ > cap) return 'over';
  if (occ < cap) return 'partial';
  return 'full';
}
function buildingStats(buildingId) {
  const rooms = roomsForBuilding(buildingId);
  let staff = 0, capacity = 0, vacant = 0, overRooms = 0, overStaff = 0, pending = 0, onVacation = 0;
  const byStatus = { empty: 0, partial: 0, full: 0, over: 0 };
  rooms.forEach(r => {
    staff += occupantCount(r); capacity += (r.capacity || 0); vacant += vacantCount(r);
    const over = overCount(r);
    if (over > 0) { overRooms++; overStaff += over; }
    byStatus[roomStatus(r)]++;
    (r.occupants || []).forEach(o => {
      if (o.status && o.status.startsWith('Not found')) pending++;
      if (o.status === 'On Vacation') onVacation++;
    });
  });
  return { rooms: rooms.length, staff, capacity, vacant, overRooms, overStaff, pending, onVacation, byStatus };
}
function allOccupantsFlat() {
  const out = [];
  Object.values(state.rooms).forEach(r => {
    (r.occupants || []).forEach(o => out.push({ ...o, buildingId: r.buildingId, roomNo: r.roomNo, roomDocId: r.id }));
  });
  return out;
}
function fmtDate(d) {
  if (!d) return 'Never';
  const dt = (d.toDate) ? d.toDate() : new Date(d);
  return dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtDateTime(d) {
  if (!d) return '';
  const dt = (d.toDate) ? d.toDate() : new Date(d);
  return dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) + ' ' + dt.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}
function uid() { return 'occ_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function occupantSubLine(o) {
  const parts = ['ID: ' + (o.iqama || '—')];

    parts.push('  ·  ');
    parts.push(el('a', { href: 'tel:' + o.mobile, class: 'mobile-link', onclick: (e) => e.stopPropagation() }, [o.mobile]));
  }
  if (o.status) parts.push('  ·  ' + o.status);
  return parts;
}
function toast(msg, isError) {
  const t = el('div', { class: 'toast' + (isError ? ' toast-error' : '') }, [msg]);

}

  if (!date) return true;
  const dt = date.toDate ? date.toDate() : new Date(date);
  return (Date.now() - dt.getTime()) > 30 * 24 * 3600 * 1000;
}

function icon(name) { return el('span', { class: 'icon', html: ICONS[name] || '' }); }

// ---------- Session (named users, each with their own code + permissions) ----------
function isUnlocked() { return sessionStorage.getItem('oza_unlocked') === '1'; }
function setSession(uid, name, role, permissions) {
  sessionStorage.setItem('oza_unlocked', '1');
  sessionStorage.setItem('oza_uid', uid);
  sessionStorage.setItem('oza_name', name);
  sessionStorage.setItem('oza_role', role);
  sessionStorage.setItem('oza_perms', JSON.stringify(permissions || {}));
}
function getRole() { return sessionStorage.getItem('oza_role') || 'viewer'; }
function getUserName() { return sessionStorage.getItem('oza_name') || 'Unknown'; }
function getUid() { return sessionStorage.getItem('oza_uid') || ''; }
function getPerms() { try { return JSON.parse(sessionStorage.getItem('oza_perms') || '{}'); } catch (e) { return {}; } }
function can(action) {
  const role = getRole();
  if (role === 'admin' || role === 'superadmin') return true;
  if (role === 'viewer') return false;
  return !!getPerms()[action]; // 'staff' role: per-user permission flags
}
function lock() {
  sessionStorage.removeItem('oza_unlocked'); sessionStorage.removeItem('oza_uid');
  sessionStorage.removeItem('oza_name'); sessionStorage.removeItem('oza_role'); sessionStorage.removeItem('oza_perms');
  location.hash = ''; renderPinGate();
}

function ensureAnonAuth() {
  return new Promise((resolve) => {
    const unsub = auth.onAuthStateChanged(user => {
      unsub();
      if (user) resolve(user);
      else auth.signInAnonymously().then(cred => resolve(cred.user)).catch(() => resolve(null));
    });
  });
}

function renderPinGate(errorMsg) {
  const root = $('#app-root');
  root.innerHTML = '';
  root.appendChild(el('div', { class: 'pin-screen' }, [
    el('div', { class: 'pin-card' }, [
      el('img', { src: LOGO_DATA_URI, class: 'pin-logo' }),
      el('h1', {}, ['OZA Accommodation']),
      el('p', { class: 'muted' }, ['Enter your access code to continue']),
      (() => {
        const input = el('input', { type: 'password', inputmode: 'numeric', class: 'pin-input', placeholder: '••••', autofocus: 'true' });
        let visible = false;
        const toggleBtn = el('button', { type: 'button', class: 'pin-toggle', title: 'Show code', html: ICONS.eye });
        toggleBtn.addEventListener('click', () => {
          visible = !visible;
          input.type = visible ? 'text' : 'password';
          toggleBtn.innerHTML = visible ? ICONS.eyeOff : ICONS.eye;
          input.focus();
        });
        const inputWrap = el('div', { class: 'pin-input-wrap' }, [input, toggleBtn]);
        const btn = el('button', { class: 'btn btn-primary btn-block' }, ['Unlock']);
        const err = errorMsg ? el('div', { class: 'error-text' }, [errorMsg]) : null;
        const wrap = el('div', {}, [inputWrap, btn]);
        if (err) wrap.appendChild(err);
        const submit = async () => {
          const val = input.value.trim();
          if (!val) return;
          await ensureAnonAuth();
          let snap;
          try { snap = await db.collection('users').where('code', '==', val).limit(1).get(); }
          catch (e) { console.error(e); renderPinGate('Wrong code, try again.'); return; }
          if (snap.empty) { renderPinGate('Wrong code, try again.'); return; }
          const doc = snap.docs[0];
          const u = doc.data();
          setSession(doc.id, u.name || 'User', u.role || 'viewer', u.permissions || {});
          location.hash = '/dashboard'; // always land on Dashboard on a fresh login
          boot();
        };
        btn.addEventListener('click', submit);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
        return wrap;
      })(),
    ]),
  ]));
}

function logAudit(action, detail) {
  db.collection('audit').add({ ts: firebase.firestore.FieldValue.serverTimestamp(), user: getUserName(), action, detail: detail || '' })
    .catch(e => console.error(e));
}


// ---------- Router ----------
function currentRoute() {
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  return { name: parts[0] || 'dashboard', arg: parts[1] || null };
}
window.addEventListener('hashchange', render);

function goto(hash) { location.hash = hash; }

// ---------- Shell ----------
function renderShell() {
  const root = $('#app-root');
  root.innerHTML = '';
  const tabs = [
    tabBtn('dashboard', 'Home', 'home'),
    tabBtn('search', 'Search', 'search'),
  ];
  if (can('verify')) tabs.push(tabBtn('reconcile', 'Verify', 'verify'));
  tabs.push(tabBtn('export', 'Export', 'export'));
  if (getRole() === 'admin' || getRole() === 'superadmin') tabs.push(tabBtn('settings', 'More', 'settings'));
  root.appendChild(el('div', { class: 'app-shell' }, [
    el('header', { class: 'topbar' }, [
      el('img', { src: LOGO_DATA_URI, class: 'topbar-logo' }),
      el('div', { class: 'topbar-title' }, [el('div', {}, ['OZA']), el('div', {}, ['Staff Accommodation'])]),
      el('div', { class: 'topbar-spacer' }),
      el('div', { class: 'topbar-user' }, [getUserName()]),
      el('button', { class: 'logout-btn', title: 'Log out (' + getUserName() + ')', html: ICONS.logout, onclick: () => { if (confirm('Log out?')) lock(); } }),
    ]),
    el('main', { id: 'view', class: 'view' }),
    el('nav', { class: 'tabbar' }, tabs),
  ]));
}
function tabBtn(route, label, iconName) {
  const active = currentRoute().name === route;
  return el('button', { class: 'tab-btn' + (active ? ' active' : ''), onclick: () => goto('/' + route) }, [
    el('span', { class: 'tab-icon', html: ICONS[iconName] }),
    el('span', { class: 'tab-label' }, [label]),
  ]);
}

// ---------- Views ----------
function render() {
  if (!isUnlocked()) { renderPinGate(); return; }
  renderShell();
  const view = $('#view');
  const { name, arg } = currentRoute();
  if (name === 'settings' && getRole() !== 'admin' && getRole() !== 'superadmin') { goto('/dashboard'); return; }
  if (name === 'reconcile' && !can('verify')) { goto('/dashboard'); return; }
  if (name === 'dashboard') renderDashboard(view);
  else if (name === 'vacation') renderVacationList(view);
  else if (name === 'rooms') renderRoomStatusList(view, arg);
  else if (name === 'building') renderBuildingDetail(view, arg);
  else if (name === 'room') renderRoomDetail(view, arg);
  else if (name === 'search') renderSearch(view);
  else if (name === 'reconcile') renderReconcile(view, arg);
  else if (name === 'export') renderExport(view);
  else if (name === 'settings') renderSettings(view);
  else renderDashboard(view);
}

function renderDashboard(view) {
  view.innerHTML = '';
  const buildings = Object.values(state.buildings).sort((a, b) => naturalCompare(a.id, b.id));
  const statusLabels = { empty: 'Empty', partial: 'Open', full: 'Full', over: 'Over' };
  const statusBadgeCls = { empty: 'badge-empty', partial: 'badge-vacant', full: 'badge-full', over: 'badge-over' };
  let totalStaff = 0, totalVacant = 0, totalRooms = 0, totalVacation = 0;
  const cards = buildings.map(b => {
    const s = buildingStats(b.id);
    totalStaff += s.staff; totalVacant += s.vacant; totalRooms += s.rooms; totalVacation += s.onVacation;
    const stale = isStale(b.lastVerified);
    const activeStatuses = Object.entries(s.byStatus).filter(([, v]) => v > 0);
    // All status badges live in one right-aligned stack next to the name —
    // one badge when every room agrees, several stacked when they don't —
    // never a separate block on the left.
    // Badges float in the top-right corner (absolutely positioned, see CSS)
    // so a tall stack of 4 never pushes the text below it down the card.
    const badgeStack = el('div', { class: 'badge-stack' }, activeStatuses.map(([status, count]) => {
      const text = activeStatuses.length === 1
        ? (status === 'partial' ? (s.vacant + ' open') : status === 'over' ? 'Over-equipped' : statusLabels[status])
        : (count + ' ' + statusLabels[status]);
      return el('div', { class: 'badge ' + statusBadgeCls[status] }, [text]);
    }));
    const cardChildren = [
      badgeStack,
      el('div', { class: 'building-name' }, [b.name]),
      el('div', { class: 'building-meta' }, [s.rooms + ' Rooms — ' + s.staff + ' Staff / ' + s.capacity]),
    ];
    cardChildren.push(el('div', { class: 'building-meta ' + (stale ? 'verify-stale' : 'muted') }, ['Last verified: ' + fmtDate(b.lastVerified)]));
    if (s.pending > 0) cardChildren.push(el('div', { class: 'building-meta pending-flag' }, [s.pending + ' Staff pending verification']));
    return el('div', { class: 'card building-card', onclick: () => goto('/building/' + b.id) }, cardChildren);
  });
  // room-level counts across the whole compound, for the second stat row
  let fullRooms = 0, emptyRooms = 0, overRooms2 = 0;
  Object.values(state.rooms).forEach(r => {
    const st = roomStatus(r);
    if (st === 'full') fullRooms++;
    else if (st === 'empty') emptyRooms++;
    else if (st === 'over') overRooms2++;
  });
  view.appendChild(el('div', { class: 'section' }, [
    el('div', { class: 'stat-row' }, [
      statBox(totalStaff, 'Total Staff'),
      statBox(totalRooms, 'Rooms'),
      statBox(totalVacant, 'Vacant Spaces', () => goto('/rooms/partial')),
    ]),
  ]));
  view.appendChild(el('div', { class: 'section' }, [
    el('div', { class: 'stat-row' }, [
      statBox(fullRooms, 'Full Rooms', () => goto('/rooms/full')),
      statBox(emptyRooms, 'Empty Rooms', () => goto('/rooms/empty')),
      statBox(overRooms2, 'Over-equipped', () => goto('/rooms/over')),
    ]),
  ]));
  if (totalVacation > 0) {
    view.appendChild(el('div', { class: 'section' }, [
      el('div', { class: 'card vacation-banner', onclick: () => goto('/vacation') }, [
        el('div', {}, [el('b', {}, [String(totalVacation)]), ' staff currently on vacation (not on site)']),
        el('div', { class: 'muted small' }, ['Tap to see the list and mark anyone back']),
      ]),
    ]));
  }
  view.appendChild(el('div', { class: 'section' }, [
    el('div', { class: 'section-title' }, ['Buildings']),
    el('div', { class: 'card-grid' }, cards),
  ]));
}
function statBox(num, label, onclick) {

function renderBuildingDetail(view, buildingId) {
  view.innerHTML = '';
  const b = state.buildings[buildingId];

  const rooms = roomsForBuilding(buildingId);
  view.appendChild(el('div', { class: 'section sticky-header' }, [

    el('div', { class: 'page-title' }, [b.name]),

      const cap = parseInt(bulkInp.value, 10);

  view.appendChild(el('div', { class: 'section' }, [

    ]),

  view.appendChild(el('div', { class: 'section' }, [
    el('label', { class: 'field-label' }, ['Room capacity']),
    can('edit')
      ? (() => {
          const inp = el('input', { type: 'number', min: '1', class: 'input-inline', value: String(r.capacity || 1) });
          const saveBtn = el('button', { class: 'btn btn-primary', style: 'margin-top:8px;' }, ['Save Capacity']);
          // A plain change/blur listener isn't reliable here — on mobile, typing
          // a number then immediately tapping Back can navigate away before the
          // blur ever fires, silently discarding the edit. An explicit button
          // makes the save a deliberate tap that always fires.
          const save = () => updateRoomCapacity(docId, parseInt(inp.value, 10) || 1);
          saveBtn.addEventListener('click', save);
          inp.addEventListener('change', save);
          return el('div', {}, [inp, saveBtn]);

function reconcileRow(room, o, checks, registry) {
  const present = !(o.status && o.status.startsWith('Not found'));
  checks[o.id] = present;
  const rowEl = el('div', { class: 'occupant-row reconcile-row' + (present ? '' : ' occupant-flag') });
  const cb = el('input', { type: 'checkbox', checked: present ? 'true' : null });
  cb.addEventListener('change', () => { checks[o.id] = cb.checked; rowEl.classList.toggle('occupant-flag', !cb.checked); });
  if (registry) registry.push({ cb, rowEl, occId: o.id });
  rowEl.appendChild(el('label', { class: 'reconcile-check' }, [cb]));
  rowEl.appendChild(occupantAvatar(o));
  rowEl.appendChild(el('div', { class: 'occupant-main' }, [
    el('div', { class: 'occupant-name' }, [o.name]),
    el('div', { class: 'occupant-sub muted' }, occupantSubLine(o)),
  ]));
  const actions = [];
  if (can('edit')) actions.push(el('button', { class: 'icon-btn', title: 'Edit', html: ICONS.edit, onclick: () => openEditOccupantModal(room, o) }));
  if (can('transfer')) actions.push(el('button', { class: 'icon-btn', title: 'Transfer', html: ICONS.transfer, onclick: () => openTransferModal(room, o) }));
  if (can('delete')) actions.push(el('button', { class: 'icon-btn icon-btn-danger', title: 'Remove', html: ICONS.trash, onclick: () => confirmRemoveOccupant(room, o) }));
  if (actions.length) rowEl.appendChild(el('div', { class: 'occupant-actions' }, actions));
  return rowEl;
}
async function finishReconcile(buildingId, rooms, checks, verifiedBy) {
  const mismatches = [];
  const batch = db.batch();
  const now = firebase.firestore.FieldValue.serverTimestamp();
  rooms.forEach(r => {
    let changed = false;
    const occ = (r.occupants || []).map(o => {
      const found = checks[o.id] !== false;
      let newStatus = o.status || null;
      if (!found) {
        newStatus = 'Not found on last verify';
        mismatches.push(r.roomNo + ' — ' + o.name);
      } else if (newStatus && newStatus.startsWith('Not found')) {
        newStatus = null;
      }
      if (newStatus !== (o.status || null)) changed = true;
      return { ...o, status: newStatus };
    });
    if (changed) batch.set(db.collection('rooms').doc(r.id), { occupants: occ }, { merge: true });
  });
  batch.set(db.collection('buildings').doc(buildingId), { lastVerified: now, verifiedBy: verifiedBy || 'Unspecified' }, { merge: true });
  await batch.commit();
  logAudit('Verified building', (state.buildings[buildingId] ? state.buildings[buildingId].name : buildingId) + ' — ' + (mismatches.length ? mismatches.length + ' mismatch(es)' : 'all matched'));
  toast(mismatches.length ? (mismatches.length + ' mismatch(es) flagged — fix them below') : 'All matched — verification saved');
  // stay on this building's verify page (it re-renders live from Firestore) so
  // flagged people can be edited/transferred/removed right away.
}

let exceljsPromise = null;
function loadExcelJS() {
  if (window.ExcelJS) return Promise.resolve();
  if (exceljsPromise) return exceljsPromise;
  exceljsPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
    s.onload = () => resolve();
    s.onerror = () => { exceljsPromise = null; reject(new Error('load failed')); };
    document.head.appendChild(s);
  });
  return exceljsPromise;
}

    if (logoId) ws.addImage(logoId, { tl: { col: 0, row: 0 }, ext: { width: 54, height: 49 } });

    header.eachCell(c => {

    roomsForBuilding(b.id).forEach(r => {
      const startRow = ws.rowCount + 1;

      } else {

          rowsAdded++;
        });
      }
      zebra = !zebra;
      const endRow = startRow + rowsAdded - 1;
      for (let rr = startRow; rr <= endRow; rr++) {
        ws.getRow(rr).eachCell({ includeEmpty: true }, c => {
          c.border = { bottom: { style: 'thin', color: { argb: 'FFE2E6EC' } } };

  URL.revokeObjectURL(url);
}

async function clearAudit(days) {
  let query = db.collection('audit');
  if (days !== null) query = query.where('ts', '<', new Date(Date.now() - days * 24 * 3600 * 1000));
  const snap = await query.get();
  if (snap.empty) { toast('Nothing to clear'); return; }
  const docs = snap.docs;
  for (let i = 0; i < docs.length; i += 400) {
    const batch = db.batch();
    docs.slice(i, i + 400).forEach(d => batch.delete(d.ref));
    await batch.commit();
  }
  toast(docs.length + ' activity entries cleared');
}

function openAddOccupantModal(buildingId, presetRoomNo) {
  const rooms = roomsForBuilding(buildingId);
  const roomSelect = el('select', { class: 'input-inline' }, rooms.map(r => el('option', { value: r.roomNo, selected: presetRoomNo === r.roomNo ? 'true' : null }, [r.roomNo + ' (' + occupantCount(r) + '/' + r.capacity + ')'])));
  const nameInp = el('input', { type: 'text', class: 'input-inline', placeholder: 'Full name' });
  const iqamaInp = el('input', { type: 'text', class: 'input-inline', placeholder: 'Iqama / ID number' });
  const mobileInp = el('input', { type: 'text', class: 'input-inline', placeholder: 'Mobile number' });
  const saveBtn = el('button', { class: 'btn btn-primary btn-block' }, ['Add']);
  saveBtn.addEventListener('click', async () => {
    if (!nameInp.value.trim()) { toast('Name is required', true); return; }
    const roomDoc = roomDocId(buildingId, roomSelect.value);
    const room = state.rooms[roomDoc];
    const occ = [...(room.occupants || []), { id: uid(), name: nameInp.value.trim(), iqama: iqamaInp.value.trim(), mobile: mobileInp.value.trim(), status: null }];
    await db.collection('rooms').doc(roomDoc).set({ occupants: occ }, { merge: true });
    logAudit('Added staff', nameInp.value.trim() + ' → ' + (state.buildings[buildingId] ? state.buildings[buildingId].name : buildingId) + ' Room ' + roomSelect.value);
    toast('Added ' + nameInp.value.trim());
    closeModal();
  });
  openModal('Add Occupant', el('div', {}, [
    el('label', { class: 'field-label' }, ['Room']), roomSelect,
    el('label', { class: 'field-label' }, ['Name']), nameInp,
    el('label', { class: 'field-label' }, ['Iqama / ID No.']), iqamaInp,
    el('label', { class: 'field-label' }, ['Mobile']), mobileInp,
    saveBtn,
  ]));
}

function resizeImageToDataUri(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
        else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function occupantAvatar(o) {
  if (o.photo) return el('img', { src: o.photo, class: 'occ-avatar' });
  const initial = (o.name || '?').trim().charAt(0).toUpperCase() || '?';
  return el('div', { class: 'occ-avatar occ-avatar-fallback' }, [initial]);
}
function openEditOccupantModal(room, o) {
  const nameInp = el('input', { type: 'text', class: 'input-inline', value: o.name || '' });
  const iqamaInp = el('input', { type: 'text', class: 'input-inline', value: o.iqama || '' });
  const mobileInp = el('input', { type: 'text', class: 'input-inline', value: o.mobile || '' });
  const statusSelect = el('select', { class: 'input-inline' });
  const newStatusInp = el('input', { type: 'text', class: 'input-inline', placeholder: 'New status name' });
  newStatusInp.style.display = 'none';
  function refreshStatusOptions() {
    statusSelect.innerHTML = '';
    statusSelect.appendChild(el('option', { value: '' }, ['— None —']));
    const opts = state.statusOptions.slice();
    if (o.status && !opts.includes(o.status)) opts.push(o.status);
    opts.forEach(s => statusSelect.appendChild(el('option', { value: s, selected: s === (o.status || '') ? 'true' : null }, [s])));
    statusSelect.appendChild(el('option', { value: '__new__' }, ['+ Add new status…']));
  }
  refreshStatusOptions();
  statusSelect.addEventListener('change', () => { newStatusInp.style.display = statusSelect.value === '__new__' ? '' : 'none'; });
  let photoData = o.photo || null;
  const preview = el('img', { class: 'photo-preview', src: photoData || '' });
  preview.style.display = photoData ? '' : 'none';
  const fileInp = el('input', { type: 'file', accept: 'image/*', capture: 'environment', class: 'input-inline' });
  fileInp.addEventListener('change', async () => {
    const f = fileInp.files[0];
    if (!f) return;
    try {
      photoData = await resizeImageToDataUri(f, 480, 0.6);
      preview.src = photoData; preview.style.display = '';
    } catch (e) { toast('Could not read that photo', true); }
  });
  const removePhotoBtn = el('button', { class: 'btn btn-outline', onclick: () => { photoData = null; preview.style.display = 'none'; preview.src = ''; } }, ['Remove Photo']);
  const saveBtn = el('button', { class: 'btn btn-primary btn-block' }, ['Save Changes']);
  saveBtn.addEventListener('click', async () => {
    let finalStatus = statusSelect.value;
    if (finalStatus === '__new__') {
      finalStatus = newStatusInp.value.trim();
      if (finalStatus && !state.statusOptions.includes(finalStatus)) {
        db.collection('settings').doc('statusOptions').set({ options: firebase.firestore.FieldValue.arrayUnion(finalStatus) }, { merge: true }).catch(e => console.error(e));
      }
    }
    const occ = (room.occupants || []).map(x => x.id === o.id ? { ...x, name: nameInp.value.trim(), iqama: iqamaInp.value.trim(), mobile: mobileInp.value.trim(), status: finalStatus || null, photo: photoData } : x);
    await db.collection('rooms').doc(room.id).set({ occupants: occ }, { merge: true });
    logAudit('Edited staff', nameInp.value.trim() + ' — ' + (state.buildings[room.buildingId] ? state.buildings[room.buildingId].name : room.buildingId) + ' Room ' + room.roomNo);
    toast('Saved');
    closeModal();
  });
  openModal('Edit Occupant', el('div', {}, [
    el('label', { class: 'field-label' }, ['Name']), nameInp,
    el('label', { class: 'field-label' }, ['Iqama / ID No.']), iqamaInp,
    el('label', { class: 'field-label' }, ['Mobile']), mobileInp,
    el('label', { class: 'field-label' }, ['Status note']), statusSelect, newStatusInp,
    el('label', { class: 'field-label' }, ['Photo']),
    preview,
    fileInp,
    removePhotoBtn,
    saveBtn,
  ]));
}

function openTransferModal(room, o) {
  const buildingSelect = el('select', { class: 'input-inline' }, Object.values(state.buildings).sort((a, b) => naturalCompare(a.id, b.id)).map(b => el('option', { value: b.id, selected: b.id === room.buildingId ? 'true' : null }, [b.name])));
  let roomSelect = el('select', { class: 'input-inline' });
  function refreshRooms() {
    const rooms = roomsForBuilding(buildingSelect.value);
    roomSelect.innerHTML = '';
    rooms.forEach(r => roomSelect.appendChild(el('option', { value: r.roomNo }, [r.roomNo + ' (' + occupantCount(r) + '/' + r.capacity + ')'])));
  }
  buildingSelect.addEventListener('change', refreshRooms);
  refreshRooms();
  const saveBtn = el('button', { class: 'btn btn-primary btn-block' }, ['Move Occupant']);
  saveBtn.addEventListener('click', async () => {
    const newBuildingId = buildingSelect.value, newRoomNo = roomSelect.value;
    const newDoc = roomDocId(newBuildingId, newRoomNo);
    if (newDoc === room.id) { toast('Already in that room', true); return; }
    const batch = db.batch();
    const fromOcc = (room.occupants || []).filter(x => x.id !== o.id);
    batch.set(db.collection('rooms').doc(room.id), { occupants: fromOcc }, { merge: true });
    const toRoom = state.rooms[newDoc];
    const toOcc = [...(toRoom.occupants || []), { ...o, status: null }];
    batch.set(db.collection('rooms').doc(newDoc), { occupants: toOcc }, { merge: true });
    await batch.commit();
    logAudit('Transferred staff', o.name + ' — ' + (state.buildings[room.buildingId] ? state.buildings[room.buildingId].name : room.buildingId) + ' Room ' + room.roomNo + ' → ' + (state.buildings[newBuildingId] ? state.buildings[newBuildingId].name : newBuildingId) + ' Room ' + newRoomNo);
    toast('Moved ' + o.name);
    closeModal();
    goto('/room/' + newDoc);
  });
  openModal('Transfer ' + o.name, el('div', {}, [
    el('label', { class: 'field-label' }, ['Building']), buildingSelect,
    el('label', { class: 'field-label' }, ['Room']), roomSelect,
    saveBtn,
  ]));
}

function confirmRemoveOccupant(room, o) {
  if (!confirm('Remove ' + o.name + ' from this room?')) return;
  const occ = (room.occupants || []).filter(x => x.id !== o.id);
  db.collection('rooms').doc(room.id).set({ occupants: occ }, { merge: true }).then(() => {
    logAudit('Removed staff', o.name + ' — ' + (state.buildings[room.buildingId] ? state.buildings[room.buildingId].name : room.buildingId) + ' Room ' + room.roomNo);
    toast('Removed');
  });
}

function updateRoomCapacity(docId, cap) {
  const room = state.rooms[docId];
  db.collection('rooms').doc(docId).set({ capacity: cap }, { merge: true }).then(() => {
    logAudit('Changed room capacity', (room ? (state.buildings[room.buildingId] ? state.buildings[room.buildingId].name : room.buildingId) + ' Room ' + room.roomNo : docId) + ' → ' + cap);
    toast('Capacity saved: ' + cap);
  }).catch(e => { console.error(e); toast('Could not save — check your connection and try again', true); });
}

// ---------- Seed / import ----------
async function runSeed(force) {
  const check = await db.collection('buildings').limit(1).get();
  if (!force && !check.empty) return;
  const batchSize = 400;
  let ops = [];
  Object.values(SEED_DATA).forEach(b => {
    ops.push({ ref: db.collection('buildings').doc(b.id), data: { id: b.id, name: b.name, hasFloors: b.hasFloors, declaredRooms: b.declaredRooms, toilets: b.toilets } });
    Object.entries(b.rooms).forEach(([roomNo, r]) => {
      ops.push({ ref: db.collection('rooms').doc(roomDocId(b.id, roomNo)), data: { buildingId: b.id, roomNo, floor: r.floor, capacity: r.capacity, occupants: r.occupants } });
    });
  });
  for (let i = 0; i < ops.length; i += batchSize) {
    const batch = db.batch();
    ops.slice(i, i + batchSize).forEach(o => batch.set(o.ref, o.data));
    await batch.commit();
  }
  toast('Initial data imported (' + ops.length + ' records)');
}

// ---------- Boot ----------
function attachListeners() {
  if (unsubBuildings) unsubBuildings();
  if (unsubRooms) unsubRooms();
  if (unsubUsers) unsubUsers();
  if (unsubStatusOptions) unsubStatusOptions();
  unsubBuildings = db.collection('buildings').onSnapshot(snap => {
    const map = {};
    snap.forEach(doc => map[doc.id] = { id: doc.id, ...doc.data() });
    state.buildings = map;
    render();
  });
  unsubRooms = db.collection('rooms').onSnapshot(snap => {
    const map = {};
    snap.forEach(doc => map[doc.id] = { id: doc.id, ...doc.data() });
    state.rooms = map;
    render();
  });
  unsubUsers = db.collection('users').onSnapshot(snap => {
    const map = {};
    snap.forEach(doc => map[doc.id] = { id: doc.id, ...doc.data() });
    state.users = map;
    render();
  });
  unsubStatusOptions = db.collection('settings').doc('statusOptions').onSnapshot(snap => {
    state.statusOptions = (snap.exists && Array.isArray(snap.data().options) && snap.data().options.length) ? snap.data().options : ['On Vacation'];
  });
}

async function initialSeedIfNeeded() {
  const check = await db.collection('buildings').limit(1).get();
  if (check.empty) await runSeed(false);

  const usersCheck = await db.collection('users').limit(1).get();
  if (usersCheck.empty) {
    // fresh install, or migrating from an older build that used
    // settings/access {adminPin, staffPin} — carry those codes over so
    // nobody's memorised PIN stops working.
    let adminCode = '1234', staffCode = '5678';
    try {
      const accSnap = await db.collection('settings').doc('access').get();
      if (accSnap.exists) {
        const acc = accSnap.data();
        adminCode = acc.adminPin || acc.pin || adminCode;
        staffCode = acc.staffPin || staffCode;
      }
    } catch (e) { console.error(e); }
    const batch = db.batch();
    batch.set(db.collection('users').doc(), { name: 'Admin', code: adminCode, role: 'admin', permissions: { verify: true, edit: true, transfer: true, delete: true } });
    batch.set(db.collection('users').doc(), { name: 'Fazl', code: staffCode, role: 'staff', permissions: { verify: true, edit: true, transfer: true, delete: true } });
    batch.set(db.collection('users').doc(), { name: 'Viewer', code: '9999', role: 'viewer', permissions: {} });
    await batch.commit();
  }

  // Status-note dropdown options — seed once if missing (works for both a
  // fresh install and an existing one that predates this feature).
  try {
    const statusSnap = await db.collection('settings').doc('statusOptions').get();
    if (!statusSnap.exists) await db.collection('settings').doc('statusOptions').set({ options: ['On Vacation'] });
  } catch (e) { console.error(e); }
}

async function ensureSuperAdminMigration() {
  // Exactly one Super Admin should exist — the account that hides every other
  // admin from view. If none exists yet and the current session is a regular
  // Admin, promote this account (first admin to load the new version wins).
  if (getRole() !== 'admin') return;
  try {
    const superSnap = await db.collection('users').where('role', '==', 'superadmin').limit(1).get();
    if (!superSnap.empty) return;
    await db.collection('users').doc(getUid()).set({ role: 'superadmin' }, { merge: true });
    sessionStorage.setItem('oza_role', 'superadmin');
  } catch (e) { console.error(e); }
}
async function boot() {
  await ensureAnonAuth();
  attachListeners();
  await ensureSuperAdminMigration();
  render();
}

// ---------- Entry ----------
document.addEventListener('DOMContentLoaded', () => {
  if (isUnlocked()) {
    // returning user this session: auth + seed-check, then straight in
    ensureAnonAuth().then(initialSeedIfNeeded).then(boot).catch(e => console.error(e));
  } else {
    // show the code screen immediately — don't make people stare at a blank
    // page while Firestore is checked; auth/seeding happens quietly behind
    // it, and the submit handler itself awaits auth before checking a code.
    renderPinGate();
    ensureAnonAuth().then(initialSeedIfNeeded).catch(e => console.error(e));
  }
});

// Register the service worker so Android/Chrome offers "Add to Home Screen"
// with the app icon. sw.js and manifest.json must sit next to this file on
// the server; if they're missing this just quietly does nothing.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
